/* ── Dispatcher raíz: elige modo (libre / tablero) y delega ── */
function PictonaryController({ session, users, myId, isAdmin, SID, onClose }) {
  const game = session?.pictonary || {};
  const gState = game.gameState;
  const mode = game.mode;
  const ref = () => db.ref(`sessions/${SID}/pictonary`);
  const cerrar = async () => {
    // Primero avisamos a todo el mundo que la fase terminó (eso hace que
    // cada cliente cierre su propia pantalla del juego) y recién después
    // borramos los datos — si se borra primero, algún cliente que todavía
    // tiene la pantalla de armar equipos montada puede alcanzar a leer
    // "no hay juego" y volver a crear un esqueleto de equipos vacío justo
    // cuando se supone que estamos cerrando.
    if (onClose) onClose();
    await db.ref(`sessions/${SID}`).update({ phase: 'waiting' });
    await db.ref(`sessions/${SID}/pictonary`).remove();
  };

  const myZone = effectiveZone(users[myId]);
  if (myZone !== 'juegos' && !isAdmin) return null;

  if (!gState || gState === 'mode') {
    const wrapStyle = { position: 'fixed', inset: 0, zIndex: 250, background: '#f8f5ef', display: 'flex', flexDirection: 'column', overflow: 'hidden' };
    const headerBar = h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, padding: '12px 16px', borderBottom: '1px solid rgba(10,14,46,.08)', flexShrink: 0 } },
      h('span', { style: { fontSize: 22 } }, '🎨'),
      h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 18, color: '#15803d', textTransform: 'uppercase', letterSpacing: '.05em', flex: 1 } }, 'Pictonary Bíblico'),
      isAdmin ? h('button', { onClick: cerrar, title: 'Cerrar juego', style: { border: 'none', background: 'rgba(239,68,68,.12)', color: '#dc2626', borderRadius: 20, padding: '6px 14px', fontWeight: 800, fontSize: 12, fontFamily: 'Barlow Condensed,sans-serif', letterSpacing: '.04em', textTransform: 'uppercase', cursor: 'pointer' } }, '✕ Cerrar') : null,
    );
    if (!isAdmin) {
      return h('div', { style: wrapStyle }, headerBar,
        h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 10 } },
          h('div', { style: { fontSize: 40 } }, '🎨'),
          h('div', { style: { color: 'var(--muted)', fontSize: 14 } }, 'El anfitrión está eligiendo el modo de juego…'),
          h(Spinner, { size: 22 }),
        ),
      );
    }
    return h('div', { style: wrapStyle }, headerBar,
      h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24, gap: 16 } },
        h('h2', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 24, color: '#0a0e2e', textTransform: 'uppercase', letterSpacing: '.05em', margin: 0, textAlign: 'center' } }, '¿Cómo juegan hoy?'),
        h('div', { style: { width: '100%', maxWidth: 380, display: 'flex', flexDirection: 'column', gap: 12 } },
          h('button', {
            onClick: () => ref().update({ mode: 'libre', gameState: 'idle', scores: {} }),
            style: { textAlign: 'left', background: '#fff', border: '1px solid rgba(10,14,46,.1)', borderRadius: 18, padding: '16px 18px', cursor: 'pointer', boxShadow: '0 10px 26px rgba(10,14,46,.1)' }
          },
            h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 18, color: '#15803d', textTransform: 'uppercase', letterSpacing: '.04em' } }, '🖌️ Dibujo libre'),
            h('div', { style: { fontSize: 13, color: 'var(--muted)', marginTop: 3 } }, 'Pizarra individual · uno dibuja y todos adivinan · sin equipos'),
          ),
          h('button', {
            onClick: () => ref().update({ mode: 'tablero', gameState: 'setup', scores: {} }),
            style: { textAlign: 'left', background: '#fff', border: '1px solid rgba(10,14,46,.1)', borderRadius: 18, padding: '16px 18px', cursor: 'pointer', boxShadow: '0 10px 26px rgba(10,14,46,.1)' }
          },
            h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 18, color: '#a16207', textTransform: 'uppercase', letterSpacing: '.04em' } }, '🧩 Tablero por equipos'),
            h('div', { style: { fontSize: 13, color: 'var(--muted)', marginTop: 3 } }, '2 equipos · capitanes · tablero de 36 casillas con dados'),
          ),
        ),
      ),
    );
  }

  if (mode === 'tablero') return h(PictabTableroGame, { session, users, myId, isAdmin, SID, onClose });
  return h(PictabLibreGame, { session, users, myId, isAdmin, SID, onClose });
}

// Modal central para TODOS: quién ganó (o se acabó el tiempo / carta saltada) +
// la tarjeta que había que adivinar. Se auto-cierra a los 4s y tiene botón ✕.
function EmojiResultOverlay({ result }) {
  const [visible, setVisible] = useState(false);
  const seen = useRef(null);
  useEffect(() => {
    const ts = result && result.ts;
    if (!ts || ts === seen.current) return;
    seen.current = ts;
    setVisible(true);
    const t = setTimeout(() => setVisible(false), (result && result.ms) || 4000);
    return () => clearTimeout(t);
  }, [result && result.ts]);
  if (!visible || !result) return null;
  const tone = result.tone;
  const winner = result.winnerUid ? { name: result.winnerName || 'Alguien', avatar: result.winnerAvatar || '👤', color: result.winnerColor || '#8b5cf6' } : null;
  const accent = tone === 'win' ? '#15803d' : tone === 'skip' ? '#a16207' : '#dc2626';
  const bgGrad = tone === 'win' ? 'linear-gradient(135deg,rgba(34,197,94,.16),rgba(255,255,255,.98))' : 'linear-gradient(135deg,rgba(10,14,46,.05),rgba(255,255,255,.98))';
  const heading = tone === 'win' ? '🎉 ¡Correcto!' : tone === 'skip' ? '⏭ Carta saltada' : '⏱ ¡Se acabó el tiempo!';
  return h('div', {
    onClick: (e) => { if (e.target === e.currentTarget) setVisible(false); },
    style: { position: 'fixed', inset: 0, zIndex: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20, background: 'rgba(10,14,46,.45)', backdropFilter: 'blur(4px)' }
  },
    tone === 'win' ? h(Confetti, null) : null,
    h('div', {
      style: {
        position: 'relative', width: '100%', maxWidth: 420, background: bgGrad, borderRadius: 24,
        border: `3px solid ${accent}`, boxShadow: '0 30px 70px rgba(10,14,46,.4)', padding: '26px 24px 24px',
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, textAlign: 'center', animation: 'mr-modalIn .35s ease'
      }
    },
      h('button', {
        onClick: () => setVisible(false), title: 'Cerrar',
        style: { position: 'absolute', top: 12, right: 12, width: 30, height: 30, borderRadius: '50%', border: 'none', background: 'rgba(10,14,46,.1)', color: '#0a0e2e', fontSize: 15, cursor: 'pointer', lineHeight: 1 }
      }, '✕'),
      h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 24, color: accent, textTransform: 'uppercase', letterSpacing: '.05em' } }, heading),
      winner ? h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, background: 'rgba(21,128,61,.1)', border: '1px solid rgba(21,128,61,.3)', borderRadius: 40, padding: '6px 16px 6px 6px' } },
        h(AvatarBubble, { profile: winner, size: 34 }),
        h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 19, color: '#15803d' } }, winner.name, ' ¡gana', result.pts ? ` +${result.pts}` : '', '!'),
      ) : null,
      winner && result.near ? h('div', { style: { fontSize: 12, color: 'var(--muted)', fontStyle: 'italic', marginTop: -6 } }, '(se acercó lo suficiente)') : null,
      h('div', { style: { fontSize: 46, lineHeight: 1.1, letterSpacing: 2 } }, result.emojis || '❓'),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 2 } },
        h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 11, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.16em' } }, 'La tarjeta era'),
        h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 26, color: '#0a0e2e' } }, result.titulo || '—'),
      ),
    ),
  );
}

/* ── EmojiController — el juego completo ── */
function EmojiController({ session, users, myId, isAdmin, SID, onClose }) {
  const game = session?.emoji || {};
  const gState = game.gameState;
  const scores = game.scores || {};
  const currentItem = game.currentItem;
  const juegosUsers = Object.entries(users || {}).filter(([uid, u]) => effectiveZone(u) === 'juegos' || (isAdmin && uid === myId)).map(([uid, u]) => ({ uid, ...u }));
  const { remaining, over } = useTimer(gState === 'playing' ? game.roundStartTime : null, EMOJI_ROUND_SECONDS);
  const [chatText, setChatText] = useState('');
  const chatListRef = useRef(null);
  const lastCheckedRef = useRef(null);
  const timeoutFiredRef = useRef(null);
  const isMobile = useIsMobile();
  // Ver la respuesta SOLO en el celular del admin (nunca se transmite a nadie).
  const [showAnswer, setShowAnswer] = useState(false);
  const ref = () => db.ref(`sessions/${SID}/emoji`);

  // Por defecto oculta: cada carta nueva vuelve a esconder la respuesta.
  useEffect(() => { setShowAnswer(false); }, [game.roundStartTime]);

  const chat = game.chat ? Object.entries(game.chat).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.ts || 0) - (b.ts || 0)) : [];
  const players = game.players || {};

  // Identidad robusta: primero lo guardado en players/ (se persiste al ganar),
  // luego el diccionario de presencia, y por último un genérico. Así los nombres
  // salen bien aunque la presencia de alguien no haya sincronizado.
  const idOf = (uid) => players[uid] || users[uid] || { name: 'Jugador', avatar: '👤', color: '#8b5cf6' };

  // Participantes elegibles para puntos: los de la zona de juegos + cualquiera
  // que haya escrito en el chat (prueba de que está jugando) + los que ya tienen
  // puntaje. No depende de que la presencia haya sincronizado en este cliente.
  const participants = (() => {
    const map = {};
    juegosUsers.forEach((u) => { map[u.uid] = { uid: u.uid, name: u.name, avatar: u.avatar, color: u.color }; });
    chat.forEach((m) => { if (m.uid && !map[m.uid]) map[m.uid] = { uid: m.uid, name: m.name || 'Jugador', avatar: m.avatar || '👤', color: m.color || '#8b5cf6' }; });
    Object.keys(scores).forEach((uid) => { if (!map[uid]) { const p = idOf(uid); map[uid] = { uid, name: p.name, avatar: p.avatar, color: p.color }; } });
    return Object.values(map);
  })();

  useEffect(() => {
    const el = chatListRef.current;
    if (!el) return;
    const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    if (!nearBottom) return;

// Gmail ignora puntos antes del @ y mayúsculas — normalizamos igual al comparar.
const normalizeEmail = (email) => {
  if (!email) return '';
  const e = String(email).trim().toLowerCase();
  const at = e.indexOf('@');
  if (at < 0) return e;
  let local = e.slice(0, at);
  const domain = e.slice(at + 1);
  if (domain === 'gmail.com' || domain === 'googlemail.com') {
    local = local.split('+')[0].replace(/\./g, '');
  }
  return `${local}@${domain === 'googlemail.com' ? 'gmail.com' : domain}`;
};

const slugifyApodo = (s) => {
  const noAccents = (s || '').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function AppRoot() {
  const [authState, setAuthState] = React.useState({ loading: true, user: null });
  // Modo proyección: la URL trae ?screen=1 → la app no registra avatar propio.
  const screenMode = React.useMemo(() => isScreenMode(), []);
  // Landing previa al login. En screen mode o si ya entraron una vez se salta.
  const [landed, setLanded] = React.useState(() => {
    if (screenMode) return true;
    try { return window.localStorage.getItem(LANDING_LS_KEY) === '1'; } catch (_) { return false; }
  });
  // Tutorial post-login (solo la primera vez, fuera de screen mode).
  const [showGuide, setShowGuide] = React.useState(false);
  React.useEffect(() => {
    const off = window.auth.onAuthStateChanged((u) => {
      setAuthState({ loading: false, user: u });
      if (u && !screenMode) {
        try {
          if (window.localStorage.getItem(GUIDE_LS_KEY) !== '1') setShowGuide(true);
        } catch (_) {}
      }
    });
    // Auto-actualización: si cambia /config/appVersion, recargar.
    const verRef = window.db && window.db.ref('config/appVersion');
    let firstVer = true;
    if (verRef) verRef.on('value', (snap) => {
      const v = snap.val();
      if (firstVer) { firstVer = false; if (v && v !== APP_VERSION) window.location.reload(); return; }
      if (v && v !== APP_VERSION) window.location.reload();
    });
    return () => { off && off(); if (verRef) verRef.off(); };
  }, [screenMode]);
  const dismissGuide = () => {
    setShowGuide(false);
    try { window.localStorage.setItem(GUIDE_LS_KEY, '1'); } catch (_) {}
  };
  const enterFromLanding = () => {
    setLanded(true);
    try { window.localStorage.setItem(LANDING_LS_KEY, '1'); } catch (_) {}
  };
  if (authState.loading) return h('div', { style: { position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--cream-50)', color: 'var(--ink-soft)', fontFamily: 'var(--font-display)', fontWeight: 700, letterSpacing: '.2em', textTransform: 'uppercase', fontSize: 12 } }, 'Cargando…');
  if (!landed && !authState.user) return h(LandingPage, { onEnter: enterFromLanding });
  if (!authState.user) return h(LoginScreen, { onSignedIn: () => { /* listener picks it up */ } });
  return h(React.Fragment, null,
    h(Component, { autoWander: false, user: authState.user, screenMode }),
    showGuide ? h(GuideModal, { onClose: dismissGuide }) : null
  );
}

class Component extends React.Component {
  COLS = 16; ROWS = 12; TW = 62; TH = 31; OX = 438; OY = 102; LW = 1000; LH = 560; WALLH = 94;
  iso = (x, y) => ({ left: this.OX + (x - y) * this.TW / 2, top: this.OY + (x + y) * this.TH / 2 });
  depth = (x, y) => 1000 + Math.round((x + y) * 12);
  s2t = (px, py) => { const a = 2 * (px - this.OX) / this.TW, b = 2 * (py - this.OY) / this.TH; return { x: (a + b) / 2, y: (b - a) / 2 }; };
  clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  _localStream = null;

    isMobile: typeof window !== 'undefined' && window.innerWidth < 640,
    // Repaso es la sala de entrada permanente: todos llegan ahí directo y
    // no hay lobby de bienvenida — solo se ve el lobby (4 salas) si el
    // admin habilita la salida (ver `allowExit` en session) y la persona
    // toca "← Salas".

    roomNames: { mision: 'Misión Joven', confra: 'Confraternización', repaso: 'Repaso', templo: 'Templo · Adoración' },
    // Repaso siempre cuenta como abierta — nadie puede "cerrarla".

    avatarEditing: false,

      return { mision: make('m'), confra: make('c'), repaso: make('r'), templo: make('t') };

    activity: null, reacts: [], scale: 1, lobbyDragging: false,

    lobby: {

    },
    // Chat de voz: mi mic (local) + el estado de mic de todos (para el badge
    // 🎤 sobre el avatar y para que el admin sepa a quién mutear).
    micOn: false, speakerMuted: false, voiceUsers: {},
  };

  componentDidMount() {
    this._onResize = () => {
      this._measure();
      const m = window.innerWidth < 640;
      if (m !== this.state.isMobile) this.setState({ isMobile: m });
    };
    window.addEventListener('resize', this._onResize);
    // En celular, si la pestaña/app pasa un buen rato en segundo plano, el
    // WebSocket de Firebase puede quedar "zombie": el navegador no se da
    // cuenta de que se cortó hasta más tarde, así que al volver todo se ve
    // congelado (no llegan movimientos ni se ven los tuyos) hasta refrescar

    this._onVisibility = () => {

  // Inicializa la suscripción a Firebase y registra al usuario actual en la sesión.
  _initFirebase() {

      }).catch((e) => { console.error('[MRNT] No se pudo marcar asistencia:', e); });
    }).catch((e) => {

      console.error('[MRNT] No se pudo leer profiles/' + this.uid + ' — registro presencia mínima:', e);
      if (this.screenMode) return;
      const myMe = this.state.chars.find((c) => c.id === 'me') || {};
      const minimal = {
        id: this.uid, name: user.email?.split('@')[0] || 'Anon',
        emoji: myMe.emoji || '🌟', color: myMe.color || '#ffd000',

    });
    // Listener: sesión completa (phase + sub-actividades + openRooms + roomNames).
    this._sessRef = window.db.ref(`sessions/${this.SID}`);
    this._sessRef.on('value', (snap) => {
      const v = snap.val() || {};
      const op = v.openRooms || {};
      this.setState((s) => {
        // Auto-abrir actividad cuando phase coincida con la sala actual.
        // En modo proyección, siempre la activamos sin estar en sala.
        let activity = s.activity;
        const phase = v.phase;
        if (phase && phase !== 'waiting') {
          // Todos están fijos en Repaso (no hay que pararse en ninguna zona
          // ni rincón puntual): cualquier actividad que el admin active desde
          // el engranaje se abre para todo el mundo que esté en Repaso, sin
          // depender de dónde esté parado su avatar.
          const inMyRoom = this.screenMode || (s.currentRoom === phase) || s.currentRoom === 'repaso';
          // Repaso es opcional: nadie ve el chat auto. Aparece sólo si tocan el FAB 💬.
          // Las demás fases sí abren su pantalla cuando estás en la sala.
          if (inMyRoom && !s.activity && phase !== 'repaso') activity = phase;
          // Si la fase termina, cerrar la actividad asociada.
        } else if (phase === 'waiting' && ['confra','repaso','juegos','mision','templo'].includes(s.activity)) {
          activity = null;
        }
        // Presentaciones y videos pueden estar activos en paralelo a la sala.
        // Admin las ve siempre (incluso desde el lobby) para poder controlarlas.
        if (v.presentation?.active && !s.activity && (s.currentRoom || this.screenMode || this.isAdmin)) activity = 'presenta';
        if (v.video?.active && !s.activity && (s.currentRoom || this.screenMode || this.isAdmin))        activity = 'videos';
        if (v.wordcloud?.active && !s.activity && (s.currentRoom === 'repaso' || this.screenMode || this.isAdmin)) activity = 'wordcloud';
        return {
          session: v,
          // Repaso siempre está abierta, sin importar lo que diga openRooms.
          started: { mision: !!op.mision, confra: !!op.confra, repaso: true, templo: !!op.templo },
          roomNames: { ...s.roomNames, ...(v.roomNames || {}) },
          activity
        };
      });
    });
    // Listener: reacciones flotantes + respuestas de encuesta + historial juegos.
    this._reacLastTs = {};
    this._reacRef = window.db.ref(`sessions/${this.SID}/reactions`);
    this._reacRef.on('value', (snap) => {
      const data = snap.val() || {};
      // Detecta reacciones nuevas (no vistas todavía) y las dispara como pop
      // animado sobre la cabeza del avatar correspondiente.
      const popQueue = [];
      Object.entries(data).forEach(([uid, byTs]) => {
        if (!byTs) return;
        const tsList = Object.keys(byTs);
        let maxTs = 0, maxRid = null;
        tsList.forEach((ts) => { const n = Number(ts); if (n > maxTs) { maxTs = n; maxRid = byTs[ts]; } });
        if (!this._reacLastTs[uid]) { this._reacLastTs[uid] = maxTs; return; }

          popQueue.push({ uid, rid: maxRid, ts: maxTs });
          this._reacLastTs[uid] = maxTs;
        } else if (maxTs > this._reacLastTs[uid]) {
          this._reacLastTs[uid] = maxTs;
        }
      });
      if (popQueue.length) this._popReactions(popQueue);
      this.setState({ reactionsFb: data });
    });
    this._surveyRef = window.db.ref(`sessions/${this.SID}/survey/responses`);
    this._surveyRef.on('value', (snap) => this.setState({ surveyResponses: snap.val() || {} }));
    // Historial de juegos del usuario actual (lo usan AttendanceModal y el podio).
    this._histRef = window.db.ref(`gameHistory/${this.uid}`);
    this._histRef.on('value', (snap) => this.setState({ gameHistory: snap.val() || {} }));
    // Historial de asistencia del usuario actual (lo usa AttendanceModal).
    this._myAttRef = window.db.ref(`attendance/${this.uid}`);
    this._myAttRef.on('value', (snap) => this.setState({ myAtt: snap.val() || {} }));
    // Mensajes del chat de Repaso + reacciones por mensaje.
    this._msgsRef = window.db.ref(`sessions/${this.SID}/messages`).orderByChild('ts');
    this._msgsRef.on('value', (snap) => {
      const data = snap.val() || {};
      const list = Object.entries(data).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      this.setState({ msgs: list });
    });
    this._chatRxRef = window.db.ref(`sessions/${this.SID}/chatReactions`);
    this._chatRxRef.on('value', (snap) => this.setState({ chatReactions: snap.val() || {} }));
    // Chat de voz: estado de mic de todos (micOn propio + mutedByAdmin, que
    // solo el admin puede escribir). El modo proyección no participa.
    if (!this.screenMode) {
      window.db.ref(`sessions/${this.SID}/voice/${this.uid}`).set({ micOn: false, mutedByAdmin: false }).catch(() => {});
      window.db.ref(`sessions/${this.SID}/voice/${this.uid}`).onDisconnect().remove();
    }
    this._voiceRef = window.db.ref(`sessions/${this.SID}/voice`);
    this._voiceRef.on('value', (snap) => {
      const voiceUsers = snap.val() || {};
      // Si el admin me muteó, se apaga mi mic de verdad (no solo visualmente)
      // y hay que avisarle al usuario — no puede reactivarlo él mismo hasta
      // que el admin lo desmutee; ahí sí tiene que volver a tocar el botón.
      const mine = this.uid ? voiceUsers[this.uid] : null;
      if (mine?.mutedByAdmin && this.state.micOn) {
        this._setMicEnabled(false);
        this.setState({ micOn: false });
      }
      this.setState({ voiceUsers });
    });
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    document.removeEventListener('visibilitychange', this._onVisibility);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._lraf) cancelAnimationFrame(this._lraf);
    if (this._usersRef)     this._usersRef.off();
    if (this._sessRef)      this._sessRef.off();
    if (this._reacRef)      this._reacRef.off();
    if (this._surveyRef)    this._surveyRef.off();
    if (this._histRef)      this._histRef.off();
    if (this._myAttRef)     this._myAttRef.off();
    if (this._msgsRef)      this._msgsRef.off();
    if (this._chatRxRef)    this._chatRxRef.off();
    if (this._voiceRef)     this._voiceRef.off();
    this._closeAllVoicePeers();
    if (this.uid && this.SID && window.db && !this.screenMode) {
      window.db.ref(`users/${this.SID}/${this.uid}`).remove().catch(() => {});
      window.db.ref(`sessions/${this.SID}/voice/${this.uid}`).remove().catch(() => {});
    }
  }

  // Persiste cualquier campo del usuario actual en Firebase (con throttle suave).
  _saveMe = (patch) => {
    if (!this.uid || !this.SID || !window.db) return;
    // Si el registro inicial de login no llegó a escribirse completo (por
    // ejemplo, un corte de permisos de Firebase ese día) cada actualización
    // de movimiento/estado "repara" también los datos de identidad — así
    // nadie queda mostrándose como "Anon" para siempre hasta que recargue.
    const me = this.state.chars.find((c) => c.id === 'me');
    const heal = me ? {
      name: me.name, emoji: me.emoji, color: me.color,
      bodyColor: me.bodyColor || me.color, armColor: me.armColor || me.color,
      legColor: me.legColor, accessory: me.accessory, klass: me.klass

    window.db.ref(`users/${this.SID}/${this.uid}`).update({ ...heal, ...patch }).catch((e) => {
      console.error('[MRNT] No se pudo guardar tu estado en users/' + this.SID + '/' + this.uid + ':', e);
    });
  };
  _saveProfile = (patch) => {
    if (!this.uid || !window.db) return;
    window.db.ref(`profiles/${this.uid}`).update(patch).catch(() => {});
  };
  _measure = () => {
    const el = this.stageEl; if (!el) return;
    const sw = el.clientWidth, sh = el.clientHeight;

    if (Math.abs(scale - this.state.scale) > 0.001) this.setState({ scale });
  };
  setStage = (el) => { this.stageEl = el; if (el) requestAnimationFrame(this._measure); };

  canExit = () => this.isAdmin || !!this.state.session?.allowExit;
  exitRoom = () => {

    this.setState((s) => ({ view: 'lobby', currentRoom: null, selectedId: null, selFurn: null, placeMode: null, activity: null, userScale: 1, pan: { x: 0, y: 0 }, chars: s.chars.map((c) => c.id === 'me' ? { ...c, room: null } : c) }));

    const seg = Math.max(0, Math.min(3, Math.floor(this.state.lobby.me.lx * 4)));
    const here = this.ROOMS[seg].key;

  };

  dismissPrompt = () => this.setState((s) => ({ lobby: { ...s.lobby, dismissed: s.lobby.prompt, prompt: null } }));

  renameRoom = (key) => {
    if (!this.isAdmin) return;
    const n = window.prompt('Nombre de la sala (lo verás en la pared):', this.state.roomNames[key]);
    if (n && n.trim()) {
      if (window.db && this.SID) window.db.ref(`sessions/${this.SID}/roomNames/${key}`).set(n.trim()).catch(() => {});
      this.setState((s) => ({ roomNames: { ...s.roomNames, [key]: n.trim() } }));
    }
  };

  /* ---- furniture (per room) ---- */
  setFurn = (fn) => this.setState((s) => ({ furniture: { ...s.furniture, [s.currentRoom]: fn(s.furniture[s.currentRoom] || []) } }));
  togglePlace = (type) => {
    if (!this.state.editFurn) return;
    this.setState((s) => ({ placeMode: s.placeMode === type ? null : type, selFurn: null, selectedId: null }));
  };
  selectFurn = (id) => {
    if (!this.state.editFurn) return;
    this.setState((s) => ({ selFurn: s.selFurn === id ? null : id, selectedId: null }));
  };
  rotateFurn = (id) => { if (!this.state.editFurn) return; this.setFurn((list) => list.map((f) => f.id === id ? { ...f, dir: ((f.dir || 0) + 1) % 4 } : f)); };
  removeFurn = (id) => { if (!this.state.editFurn) return; this.setFurn((list) => list.filter((f) => f.id !== id)); this.setState({ selFurn: null }); };
  toggleEditFurn = () => { if (!this.isAdmin) return; this.setState((s) => ({ editFurn: !s.editFurn, placeMode: null, selFurn: null })); };

  /* ---- furniture drag (cuando editFurn=true) ---- */
  _furnDown = (e, id) => {

  /* ════════ CHAT DE VOZ (WebRTC malla + señalización por Firebase) ════════

     de audio "sendrecv" desde el arranque: así, cuando alguien prende su mic
     más tarde, solo hace falta `replaceTrack` — sin renegociar SDP de nuevo.

     ofrece), para que ambos lados nunca intenten armar la conexión a la vez. */
  _syncVoicePeers = (presentUids) => {
    if (this.screenMode || !this.uid) return;
    const present = new Set(presentUids);
    // Nuevo: alguien presente que todavía no tiene conexión de voz armada.
    present.forEach((uid) => { if (!this._peers[uid]) this._createVoicePeer(uid); });
    // Se fue: cerrar y limpiar su conexión.
    Object.keys(this._peers).forEach((uid) => { if (!present.has(uid)) this._teardownVoicePeer(uid); });
  };
  _createVoicePeer = (otherUid) => {
    if (!window.db || this._peers[otherUid]) return;
    const isInitiator = this.uid < otherUid;
    const pairKey = voicePairKey(this.uid, otherUid);
    const signalRef = window.db.ref(`sessions/${this.SID}/voicePeers/${pairKey}`);
    const pc = new RTCPeerConnection({ iceServers: VOICE_ICE_SERVERS });
    const audioEl = document.createElement('audio');

    const peer = { pc, audioEl, pairKey, isInitiator, signalRef, pendingRemoteCandidates: [], gotRemoteDesc: false };
    this._peers[otherUid] = peer;
    const myIceField = isInitiator ? 'iceInit' : 'iceAns';
    const theirIceField = isInitiator ? 'iceAns' : 'iceInit';
    pc.onicecandidate = (e) => { if (e.candidate) signalRef.child(myIceField).push(e.candidate.toJSON()).catch(() => {}); };
    pc.ontrack = (e) => this._attachRemoteAudio(otherUid, e.streams[0]);
    const transceiver = pc.addTransceiver('audio', { direction: 'sendrecv' });
    if (this._localStream) {
      const track = this._localStream.getAudioTracks()[0];
      if (track) transceiver.sender.replaceTrack(track).catch(() => {});
    }
    const seenIce = new Set();
    signalRef.on('value', async (snap) => {
      const v = snap.val() || {};
      try {
        if (isInitiator && v.answer && !peer.gotRemoteDesc) {
          peer.gotRemoteDesc = true;
          await pc.setRemoteDescription(new RTCSessionDescription(v.answer));
          peer.pendingRemoteCandidates.forEach((c) => pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}));
          peer.pendingRemoteCandidates = [];
        } else if (!isInitiator && v.offer && !peer.gotRemoteDesc) {
          peer.gotRemoteDesc = true;
          await pc.setRemoteDescription(new RTCSessionDescription(v.offer));
          peer.pendingRemoteCandidates.forEach((c) => pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}));
          peer.pendingRemoteCandidates = [];
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          signalRef.child('answer').set({ type: answer.type, sdp: answer.sdp }).catch(() => {});
        }
        const theirIce = v[theirIceField] || {};
        Object.entries(theirIce).forEach(([cid, cand]) => {
          if (seenIce.has(cid)) return;
          seenIce.add(cid);
          if (peer.gotRemoteDesc) pc.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});

      // página) — si no, este RTCPeerConnection nuevo podría toparse con un
      // answer viejo que ya no le corresponde.
      pc.createOffer().then((offer) => pc.setLocalDescription(offer).then(() => {

  _startRoomActivity = (key) => {
    if (!this.isAdmin || !this.SID) return;
    const inRoomUsers = Object.entries(this._usersDict()).filter(([uid, u]) => effectiveZone(u) === key);
    if (key === 'confra') {
      const uids = inRoomUsers.map(([uid]) => uid).sort(() => Math.random() - .5);
      const queueObj = {};
      uids.forEach((uid, i) => { queueObj[i] = uid; });
      db.ref(`sessions/${this.SID}`).update({
        phase: 'confra',
        confra: { active: true, queue: queueObj, currentIdx: 0, startTime: Date.now() }
      });
    } else if (key === 'repaso') {
      db.ref(`sessions/${this.SID}`).update({
        phase: 'repaso',
        repaso: { active: true, startTime: Date.now() }
      });
    } else if (key === 'juegos') {
      db.ref(`sessions/${this.SID}`).update({
        phase: 'juegos',
        juegos: { active: true, startTime: Date.now() }
      });
    } else if (key === 'mision') {
      db.ref(`sessions/${this.SID}`).update({ phase: 'mision', mision: { active: true, startTime: Date.now(), mode: 'projects' } });
    } else if (key === 'templo') {
      db.ref(`sessions/${this.SID}`).update({ phase: 'templo', templo: { active: true, startTime: Date.now() } });
    }

    if (!this.SID) return;

    if (!confra) return;
    const rawQueue = confra.queue || {};
    const queue = Array.isArray(rawQueue) ? rawQueue : Object.values(rawQueue);
    const next = (typeof confra.currentIdx === 'number' ? confra.currentIdx : 0) + 1;
    if (next >= queue.length) {
      this._endRoomActivity('confra');
    } else {
      db.ref(`sessions/${this.SID}/confra/currentIdx`).set(next);
    }
  };

          r.members.map((m, i) => h('span', { key: i, style: m.style }, m.photo ? h('img', { src: m.photo, alt: '', style: { width: '100%', height: '100%', objectFit: 'cover' } }) : m.emoji)),
        ),
      ),
      h('div', { style: { padding: '11px 14px 13px', display: 'flex', flexDirection: 'column', gap: 5 } },
        h('div', { style: r.mrntStyle }, r.mrnt),
        h('div', { style: r.nameStyle }, r.name),
        h('div', { style: r.statusStyle }, r.statusText),
        h('button', { onClick: r.onEnter, disabled: r.enterDisabled, style: r.enterStyle }, r.enterLabel),
        this.isAdmin ? h('div', { style: { display: 'flex', gap: 8 } },
          r.isPermanent ? null : h('button', { onClick: r.onToggleStart, title: 'Admin: cambiar estado de la sala', style: r.startStyle }, r.startLabel),
          h('button', { onClick: r.onRename, title: 'Renombrar sala', style: r.renameStyle }, '✎'),
        ) : null,
      ),
    );
  }
  renderLobbySection(v) {
    const isMobile = this.state.isMobile;
    // Mobile: un único scroll horizontal con 4 "páginas". Cada página apila
    // card + puerta de la misma sala, así swipe izquierda/derecha mueve todo
    // junto y la puerta de la sala actual queda alineada con su card.
    if (isMobile) return this._renderMobileLobby(v);
    return h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: 'radial-gradient(ellipse at 50% 0%, #fffdf8, var(--cream-50) 70%)' } },
      h('div', { style: { display: 'flex', gap: 14, padding: '14px 20px 6px', flexShrink: 0 } }, v.roomCards.map((r) => this.renderRoomCard(r, false))),
      v.lobbyGround,
    );
  }

  // Dibuja una puerta compacta para mobile, sin perspectiva 3D.
  _renderMobileDoor(r, started) {
    return h('div', { style: { position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 } },
      started ? h('div', { style: { fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 9, letterSpacing: '.1em', textTransform: 'uppercase', color: r.dark, background: '#fff', border: `1px solid ${r.color}`, borderRadius: 'var(--r-pill)', padding: '2px 9px', boxShadow: `0 2px 8px ${r.color}44` } }, '● En vivo')
              : h('div', { style: { height: 17 } }),
      h('div', { style: { position: 'relative', width: 96, height: 84, borderRadius: '18px 18px 7px 7px', padding: 6, boxSizing: 'border-box', background: started ? `linear-gradient(180deg, ${r.color}, ${r.dark})` : 'linear-gradient(180deg, #c7c2b6, #b3aea1)', border: `2px solid ${started ? r.color : 'rgba(10,14,46,.14)'}`, boxShadow: started ? `0 0 28px ${r.color}66` : 'none' } },
        started
          ? h('div', { style: { position: 'relative', width: '100%', height: '100%', borderRadius: '12px 12px 4px 4px', overflow: 'hidden', background: `radial-gradient(ellipse at 50% 120%, ${r.color}cc, #0a0c28 80%)`, boxShadow: 'inset 0 3px 8px rgba(0,0,0,.6)' } },
              h('div', { style: { position: 'absolute', top: 0, bottom: 0, left: 0, width: '34%', background: `linear-gradient(90deg, ${r.dark}, ${r.color})`, borderRight: '1px solid rgba(0,0,0,.3)', transform: 'perspective(60px) rotateY(38deg)', transformOrigin: 'left center', boxShadow: '2px 0 6px rgba(0,0,0,.4)' } },
                h('div', { style: { position: 'absolute', right: 4, top: '50%', width: 3, height: 3, borderRadius: '50%', background: '#ffd000' } })),
              h('span', { style: { position: 'absolute', right: 10, bottom: 6, fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: 17, color: '#fff', opacity: .9 } }, r.letter),
            )
          : h('div', { style: { width: '100%', height: '100%', borderRadius: '12px 12px 4px 4px', background: 'linear-gradient(180deg, #d8d3c8, #c2bdb1)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: 'inset 0 1px 3px rgba(255,255,255,.5)' } },
              h('span', { style: { fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: 28, color: 'rgba(10,14,46,.28)' } }, r.letter)),
      ),
    );
  }

  _renderMobileLobby(v) {
    const st = this.state;
    const me = st.chars.find((c) => c.id === 'me') || {};
    return h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: 'radial-gradient(ellipse at 50% 0%, #fffdf8, var(--cream-50) 70%)' } },
      h('div', { style: { flex: 1, overflowX: 'auto', overflowY: 'auto', scrollSnapType: 'x mandatory', WebkitOverflowScrolling: 'touch', padding: '10px 14px 20px' } },
        h('div', { style: { display: 'flex', gap: 10, alignItems: 'stretch' } },
          v.roomCards.map((r) => {
            const room = this.ROOMS.find((x) => x.key === r.key);
            const started = st.started[r.key];
            return h('div', { key: r.key, style: { flex: '0 0 78vw', minWidth: '78vw', maxWidth: 320, scrollSnapAlign: 'center', display: 'flex', flexDirection: 'column', gap: 14, alignItems: 'stretch' } },
              this.renderRoomCard(r, false),
              h('div', { style: { display: 'flex', justifyContent: 'center', paddingTop: 4 } },
                this._renderMobileDoor(room, started),
              ),
              h('div', { style: { textAlign: 'center', fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 10, letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--ink-soft)', opacity: .65 } },
                started ? 'Toca ENTRAR · sala abierta' : (this.isAdmin ? 'Tu sala · toca ABRIR' : '🔒 Espera que abran')),
            );
          })
        )
      ),
      // Footer del lobby con avatar del usuario actual + hint.
      h('div', { style: { display: 'flex', alignItems: 'center', gap: 11, padding: '10px 14px 12px', borderTop: '1px solid var(--border-on-light)', background: '#fff' } },
        h('div', { style: { width: 44, height: 44, borderRadius: '50%', overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center', background: `radial-gradient(circle at 35% 35%, ${(me.color || '#ffd000')}33, ${(me.color || '#ffd000')}11)`, border: `2.5px solid ${me.color || '#ffd000'}`, fontSize: 22, flexShrink: 0, boxShadow: '0 0 12px rgba(255,208,0,.3)' } },
          me.photo ? h('img', { src: me.photo, alt: '', style: { width: '100%', height: '100%', objectFit: 'cover' } }) : (me.emoji || '🌟')),
        h('div', { style: { flex: 1, minWidth: 0 } },
          h('div', { style: { fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: 14, color: 'var(--ink)', lineHeight: 1.1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, me.name || 'Tú'),
          h('div', { style: { fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 10, letterSpacing: '.16em', textTransform: 'uppercase', color: 'var(--ink-soft)', marginTop: 2 } }, '◀ Desliza para ver las 4 salas MRNT ▶')
        ),
      ),
    );
  }
  renderFooter(v) {
    const editFurn = this.state.editFurn;
    // Mobile: footer compacto. Admin tiene además toggle de muebles.
    if (this.state.isMobile) {
      return h('footer', { style: { display: 'flex', alignItems: 'center', gap: 7, padding: '8px 12px', background: '#fff', borderTop: '1px solid var(--border-on-light)', flexShrink: 0, zIndex: 50, justifyContent: 'space-between', flexWrap: 'wrap' } },
        h('button', { onClick: () => this.setState({ avatarEditing: true }), style: { display: 'flex', alignItems: 'center', gap: 5, background: '#fff', color: 'var(--ink)', border: '1px solid var(--border-on-light)', borderRadius: 'var(--r-pill)', padding: '7px 12px', cursor: 'pointer', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 11, letterSpacing: '.04em', textTransform: 'uppercase' } }, '🎨 Avatar'),
        h('button', { onClick: v.onMyStatus, style: { display: 'flex', alignItems: 'center', gap: 5, background: 'var(--action-accent)', color: 'var(--navy-900)', border: 'none', borderRadius: 'var(--r-pill)', padding: '7px 14px', cursor: 'pointer', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 11, letterSpacing: '.04em', textTransform: 'uppercase', boxShadow: 'var(--glow-yellow)' } }, '✎ Estado'),
        this.isAdmin ? h('button', { onClick: this.toggleEditFurn, style: { display: 'flex', alignItems: 'center', gap: 5, background: editFurn ? 'var(--ink)' : '#fff', color: editFurn ? 'var(--cream-50)' : 'var(--ink)', border: `1px solid ${editFurn ? 'var(--ink)' : 'var(--border-on-light)'}`, borderRadius: 'var(--r-pill)', padding: '7px 12px', cursor: 'pointer', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 11, letterSpacing: '.04em', textTransform: 'uppercase' } }, editFurn ? '✓ Listo' : '🛋️ Muebles') : null,
        // Cuando admin abre edición, ofrecemos la grilla de tipos para agregar muebles nuevos.
        editFurn && this.isAdmin ? h('div', { style: { width: '100%', display: 'flex', flexWrap: 'wrap', gap: 6, paddingTop: 6 } },
          v.furnitureItems.map((f, i) => h('button', { key: i, onClick: f.onClick, style: f.style }, h('span', { style: { fontSize: 13 } }, f.icon), f.label))
        ) : null,
      );
    }
    return h('footer', { style: { display: 'flex', alignItems: 'center', gap: 7, padding: '10px 16px', background: '#fff', borderTop: '1px solid var(--border-on-light)', flexShrink: 0, flexWrap: 'wrap', zIndex: 50 } },
      // Toggle de edición de muebles (solo admin).
      this.isAdmin ? h('button', { onClick: this.toggleEditFurn, style: { display: 'flex', alignItems: 'center', gap: 6, background: editFurn ? 'var(--ink)' : '#fff', color: editFurn ? 'var(--cream-50)' : 'var(--ink)', border: `1.5px solid ${editFurn ? 'var(--ink)' : 'var(--border-on-light)'}`, borderRadius: 'var(--r-pill)', padding: '7px 14px', cursor: 'pointer', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 12, letterSpacing: '.05em', textTransform: 'uppercase', marginRight: 6 } }, editFurn ? '✓ Listo' : '🛋️ Editar muebles') : null,
      // Grilla de tipos visible solo cuando el admin está editando.
      editFurn && this.isAdmin ? h(React.Fragment, null,
        h('span', { style: { fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 10, letterSpacing: '.16em', textTransform: 'uppercase', color: 'var(--ink-soft)', marginRight: 2 } }, 'Colocar'),
      ) : null,
      v.furnitureItems.map((f, i) => h('button', { key: i, onClick: f.onClick, style: f.style }, h('span', { style: { fontSize: 15 } }, f.icon), f.label)),
      h('div', { style: { flex: 1, minWidth: 8 } }),
      h('button', { onClick: () => this.setState({ avatarEditing: true }), style: { display: 'flex', alignItems: 'center', gap: 6, background: '#fff', color: 'var(--ink)', border: '1px solid var(--border-on-light)', borderRadius: 'var(--r-pill)', padding: '9px 16px', cursor: 'pointer', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 13, letterSpacing: '.05em', textTransform: 'uppercase' } }, '🎨 Mi avatar'),
      h('button', { onClick: v.onMyStatus, style: { display: 'flex', alignItems: 'center', gap: 7, background: 'var(--action-accent)', color: 'var(--navy-900)', border: 'none', borderRadius: 'var(--r-pill)', padding: '9px 18px', cursor: 'pointer', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 13, letterSpacing: '.05em', textTransform: 'uppercase', boxShadow: 'var(--glow-yellow)' } }, '✎ Mi estado'),
    );
  }
  render() {
    const v = this.renderVals();
    const st = this.state;
    const me = st.chars.find((c) => c.id === 'me') || {};
    const screen = this.screenMode;
    return h('div', { style: { display: 'flex', flexDirection: 'column', height: '100vh', width: '100%', background: 'var(--cream-50)', fontFamily: 'var(--font-sans)', overflow: 'hidden', WebkitUserSelect: 'none', userSelect: 'none' } },
      this.renderHeader(v, me),
      v.inLobby ? this.renderLobbySection(v) : null,
      v.inRoom ? h(React.Fragment, null, v.stage, screen ? null : this.renderFooter(v)) : null,
      !screen && st.avatarEditing ? h(AvatarEditor, { char: me, onSave: this.saveAvatar, onClose: () => this.setState({ avatarEditing: false }) }) : null,
      // AdminPanel global (botón 👑 flotante) — solo admin.
      !screen && this.isAdmin ? h(AdminPanel, {
        session: st.session || {}, users: this._usersDict(),
        onStartConfra: (us) => { const queueObj = {}; us.map(([uid]) => uid).sort(() => Math.random() - .5).forEach((u, i) => { queueObj[i] = u; }); db.ref(`sessions/${this.SID}`).update({ phase: 'confra', confra: { active: true, queue: queueObj, currentIdx: 0, startTime: Date.now() } }); },
        onNextSpeaker: this._nextConfraSpeaker,
        onEndConfra: () => db.ref(`sessions/${this.SID}`).update({ phase: 'waiting', confra: null }),
        onStartRepaso: () => {
          // Reset del chat y reacciones al abrir Repaso (sala limpia).
          db.ref(`sessions/${this.SID}/messages`).remove().catch(() => {});
          db.ref(`sessions/${this.SID}/chatReactions`).remove().catch(() => {});
          db.ref(`sessions/${this.SID}`).update({ phase: 'repaso', repaso: { active: true, startTime: Date.now() } });
        },
        onEndRepaso: () => {
          db.ref(`sessions/${this.SID}/messages`).remove().catch(() => {});
          db.ref(`sessions/${this.SID}/chatReactions`).remove().catch(() => {});
          db.ref(`sessions/${this.SID}`).update({ phase: 'waiting', repaso: null });
        },
        onOpenPresentationMenu: () => this.setState({ activity: 'presenta-menu' }),
        onEndPresentation: () => db.ref(`sessions/${this.SID}/presentation`).remove(),
        onOpenVideoMenu: () => this.setState({ activity: 'videos-menu' }),
        onEndVideo: () => db.ref(`sessions/${this.SID}/video`).remove(),
        onStartJuegos: () => db.ref(`sessions/${this.SID}`).update({ phase: 'juegos', juegos: { active: true, startTime: Date.now() } }),
        onEndJuegos: () => db.ref(`sessions/${this.SID}`).update({ phase: 'waiting', juegos: null }),
        onStartMision: (us, mode) => db.ref(`sessions/${this.SID}`).update({ phase: 'mision', mision: { active: true, mode: mode || 'projects', startTime: Date.now() } }),
        onEndMision: () => db.ref(`sessions/${this.SID}`).update({ phase: 'waiting', mision: null }),
        onStartTemplo: () => db.ref(`sessions/${this.SID}`).update({ phase: 'templo', templo: { active: true, startTime: Date.now() }, survey: { active: true } }),
        onEndTemplo: () => db.ref(`sessions/${this.SID}`).update({ phase: 'waiting', templo: null, survey: null }),
        onOpenStats: () => this.setState({ activity: 'admin-stats' }),
        onToggleWordCloud: () => {
          const a = !!this.state.session?.wordcloud?.active;
          if (a) db.ref(`sessions/${this.SID}/wordcloud/active`).set(false);
          else   db.ref(`sessions/${this.SID}/wordcloud`).set({ active: true, words: [] });
        },
        onResetSession: () => db.ref(`sessions/${this.SID}`).update({ phase: 'waiting', confra: null, repaso: null, juegos: null, mision: null, templo: null, presentation: null, video: null, wordcloud: null, tabu: null, quiensoy: null, dibuja: null, pictonary: null }),
        onOpenDownload: () => this.setState({ activity: 'download' }),
        onOpenSurveyResults: () => this.setState({ activity: 'survey-results' }),
        surveyResponses: st.surveyResponses || {},
        allowExit: !!st.session?.allowExit,
        onToggleAllowExit: () => db.ref(`sessions/${this.SID}/allowExit`).set(!st.session?.allowExit)
      }) : null,
      // Menús auxiliares (admin)
      !screen && st.activity === 'presenta-menu' ? h(PresentationMenu, { onClose: this.closeActivity, onSelect: (id) => { db.ref(`sessions/${this.SID}/presentation`).set({ id, active: true, slide: 0, startTime: Date.now() }); this.setState({ activity: 'presenta' }); } }) : null,
      !screen && st.activity === 'videos-menu' ? h(VideoMenu, { onClose: this.closeActivity, onSelect: (id) => { const v = VIDEOS.find((x) => x.id === id); db.ref(`sessions/${this.SID}/video`).set({ catalogId: id, videoId: v?.youtubeId || null, active: true, state: 'playing', position: 0, updatedAt: Date.now() }); this.setState({ activity: 'videos' }); } }) : null,
      !screen && st.activity === 'download' ? h(DataDownloadModal, Object.assign({}, this._commonProps(), { onClose: this.closeActivity })) : null,
      !screen && st.activity === 'survey-results' ? h(AdminSurveyModal, Object.assign({}, this._commonProps(), { responses: st.surveyResponses || {}, onClose: this.closeActivity })) : null,
      !screen && st.activity === 'admin-stats' ? h(AdminStatsModal, Object.assign({}, this._commonProps(), { onClose: this.closeActivity })) : null,
      // Asistencia (modal disponible siempre, abierto desde el header).
      !screen && st.activity === 'asistencia' ? h(AttendanceModal, Object.assign({}, this._commonProps(), { myAtt: st.myAtt || {}, gameHistory: st.gameHistory || {}, onClose: this.closeActivity })) : null,
      // VerseOverlay: lo abre el click en una referencia bíblica desde la presentación.
      st.verseRef ? h(VerseOverlay, { refStr: st.verseRef, broadcast: false, canClose: true, onClose: () => this.setState({ verseRef: null }) }) : null,
      // QR de acceso (admin) — útil para proyección. En screenMode siempre visible.
      // QR siempre que admin lo haya pedido (botón 📲) o en modo proyección.
      // Se renderiza fuera de cualquier `st.activity`, así que queda visible
      // en TODAS las salas y pantallas de acciones (juegos, presentaciones,
      // videos, admin, etc.) — no solo en la pantalla principal.
      // qrSize: 'small' (chip arriba) → click → 'medium' (panel grande arriba) →
      // click → 'large' (overlay a pantalla completa). Click sobre el overlay
      // grande lo vuelve a 'small'. Z-index alto (ver QR_Z) para que se vea por
      // encima de presentaciones, videos y juegos.
      (screen || (this.isAdmin && st.showQR)) ? h(DraggableQR, { qrSize: st.qrSize || (screen ? 'medium' : 'small'), setQrSize: (v) => this.setState({ qrSize: v }), qrPos: st.qrPos || null, setQrPos: (v) => this.setState({ qrPos: v }), onHide: screen ? null : () => this.setState({ showQR: false }) }) :
      // Cuando el QR está oculto, el botón del header (📲) queda tapado por
      // cualquier actividad/juego en pantalla completa (position:fixed con
      // z-index propio) — así que dejamos un disparador siempre alcanzable,
      // al mismo nivel de z-index que el QR, para poder abrirlo desde
      // cualquier sala, juego o presentación sin tener que salir primero.
      (!screen && this.isAdmin) ? h('button', {
        onClick: () => this.setState({ showQR: true }),
        title: 'Mostrar QR de acceso',
        style: {
          position: 'fixed', top: 64, right: 10, zIndex: 9990,
          width: 40, height: 40, borderRadius: '50%', border: 'none',
          background: '#fff', boxShadow: '0 10px 28px rgba(10,14,46,.28), 0 0 0 2px rgba(255,208,0,.55)',
          cursor: 'pointer', fontSize: 18, display: 'flex', alignItems: 'center', justifyContent: 'center'
        }
      }, '📲') : null,
      // FAB del chat del Repaso: aparece cuando el admin abrió Repaso (phase==='repaso')
      // y el usuario no tiene otra actividad abierta. Click → abre el chat.
      !screen && st.session?.phase === 'repaso' && st.activity !== 'repaso'
        ? h(ChatFab, { onClick: () => this.setState({ activity: 'repaso' }), count: (st.msgs || []).length })
        : null,
      // Toast de bienvenida cuando alguien se une (solo participantes).
      !screen ? h(AttNotifyToast, null) : null
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(AppRoot));
</script>
</body>
</html>
