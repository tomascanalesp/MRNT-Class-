  }

/* ── detectZone  (líneas 367-375) ── */
const detectZone = (x, y) => {
  for (const [key, z] of Object.entries(ZONES)) {
    if (x >= z.x1 && x <= z.x2 && y >= z.y1 && y <= z.y2) return key;
  }
  return 'entrada';
};

// Zona efectiva: si el campo 'zone' de RTDB no existe en las nuevas ZONES
// (por ej. usuarios viejos con valores legacy), recalcula desde (x,y).

/* ── effectiveZone  (líneas 376-378) ── */
const effectiveZone = u => u && ZONES[u.zone] ? u.zone : detectZone(u?.x ?? 50, u?.y ?? 50);

// Comprimir imagen a base64

/* ── compressImage  (líneas 379-393) ── */
const compressImage = (file, maxSize = 200) => new Promise(resolve => {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const ratio = Math.min(maxSize / img.width, maxSize / img.height);
    canvas.width = img.width * ratio;
    canvas.height = img.height * ratio;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    resolve(canvas.toDataURL('image/jpeg', 0.6));
  };
  img.src = url;
});

/* ── formatTime  (líneas 394-401) ── */
const formatTime = s => {
  const abs = Math.abs(s);
  const m = Math.floor(abs / 60).toString().padStart(2, '0');
  const sec = (abs % 60).toString().padStart(2, '0');
  return `${s < 0 ? '-' : ''}${m}:${sec}`;
};

// Hook para detectar viewport pequeño (mobile-first responsivo)

/* ── useIsMobile  (líneas 402-416) ── */
const useIsMobile = (breakpoint = 640) => {
  const [isMobile, setIsMobile] = useState(typeof window !== 'undefined' ? window.innerWidth < breakpoint : false);
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < breakpoint);
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    return () => {
      window.removeEventListener('resize', onResize);
      window.removeEventListener('orientationchange', onResize);
    };
  }, [breakpoint]);
  return isMobile;
};

/* ── DataDownloadModal  (líneas 9022-9416) ── */
function DataDownloadModal({
  onClose
}) {
  const [busy, setBusy] = useState('');
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  // Formato de descarga: 'txt' (texto separado por tabulaciones) o
  // 'excel' (CSV real, con BOM UTF-8 para que Excel abra tildes/ñ bien).
  const [format, setFormat] = useState('txt');
  // Convierte el TSV que arman fetchAttendance/fetchGames/fetchSurveys en CSV
  // válido (comas, celdas entre comillas si hace falta escapar).
  const tsvToCSV = (tsv) => tsv.split('\n').map(line => line.split('\t').map(cell => {
    const c = String(cell ?? '');
    return /[",;\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
  }).join(',')).join('\r\n');
  const dl = (content, filename) => {
    const isExcel = format === 'excel';
    const BOM = String.fromCharCode(0xFEFF);
    const out = isExcel ? BOM + tsvToCSV(content) : content;
    const finalName = isExcel ? filename.replace(/\.txt$/, '.csv') : filename;
    const blob = new Blob([out], {
      type: isExcel ? 'text/csv;charset=utf-8' : 'text/plain;charset=utf-8'
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = finalName;
    a.click();
    URL.revokeObjectURL(url);
  };

  // Las fechas son ISO YYYY-MM-DD → comparación lexicográfica directa
  const inRange = (d, s, e) => (!s || d >= s) && (!e || d <= e);
  const rangeSuffix = () => {
    if (!startDate && !endDate) return '';
    return `_${startDate || 'inicio'}_a_${endDate || 'fin'}`;
  };

  // ── Asistencia ──────────────────────────────────────────────────────
  const fetchAttendance = async () => {
    const [pSnap, aSnap] = await Promise.all([db.ref('profiles').get(), db.ref('attendance').get()]);
    const profiles = pSnap.val() || {};
    const attendance = aSnap.val() || {};
    const allDates = new Set();
    Object.values(attendance).forEach(u => Object.keys(u).forEach(d => {
      if (inRange(d, startDate, endDate)) allDates.add(d);
    }));
    const dates = [...allDates].sort();
    // Unión: todo uid con perfil + todo uid con asistencia (cubre profiles huérfanos)
    const allUids = new Set([...Object.keys(profiles), ...Object.keys(attendance)]);
    const rows = [...allUids].map(uid => {
      const p = profiles[uid] || {};
      const ua = attendance[uid] || {};
      const fallback = Object.values(ua).find(v => v && v.name)?.name;
      const name = p.name || fallback || uid;
      const tag = p.isAdmin ? ' (admin)' : '';
      const total = dates.reduce((s, d) => s + (ua[d] ? 1 : 0), 0);
      return {
        name: name + tag,
        total,
        line: name + tag + '\t' + dates.map(d => ua[d] ? '✓' : '').join('\t')
      };
    }).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
    return ['Asistencia — Maranata Class Las Condes' + (startDate || endDate ? ` (${startDate || 'inicio'} a ${endDate || 'fin'})` : ''), 'Nombre\t' + dates.join('\t'), ...rows.map(r => r.line)].join('\n');
  };

  // ── Juegos (gameHistory) ────────────────────────────────────────────
  const fetchGames = async () => {
    const snap = await db.ref('gameHistory').get();
    const data = snap.val() || {};
    const rows = [];
    Object.entries(data).forEach(([uid, games]) => {
      Object.entries(games || {}).forEach(([gid, g]) => {
        const date = g.date || '';
        if (date && !inRange(date, startDate, endDate)) return;
        rows.push({
          date,
          name: g.name || uid,
          score: g.score || 0,
          rank: g.rank || 0,
          total: g.totalPlayers || 0,
          gid
        });

// Persiste el resultado final de un juego (uid → puntaje) en /gameHistory,
// que alimenta la pestaña "Juegos" de AttendanceModal, el podio y las
// descargas de datos del admin. Antes solo Kahoot guardaba esto.
const saveGameHistory = (SID, scores, users) => {
  const sorted = Object.entries(scores || {}).sort((a, b) => b[1] - a[1]);
  if (!sorted.length) return Promise.resolve();
  const gid = `${SID}_${Date.now()}`;
  return Promise.all(sorted.map(([uid, score], i) => db.ref(`gameHistory/${uid}/${gid}`).set({
    date: SID,
    score,
    rank: i + 1,
    totalPlayers: sorted.length,
    name: users[uid]?.name || '?'
  })));
};

// (un 4º emoji extra si la tarjeta es Difícil).
const EMOJI_ITEMS = PICTONARY_ITEMS.map((it) => {
  let emojis = EMOJI_MAP[it.titulo] || '❓';
  if (it.dificultad === 'Difícil') emojis += (EMOJI_HARD_EXTRA[it.titulo] || '');
  return { titulo: it.titulo, categoria: it.categoria, dificultad: it.dificultad, pista: it.pista, emojis };
});
// Elige una tarjeta al azar (sin dados), evitando las últimas jugadas.
function emojiPickItem(history) {
  const avoid = new Set(history || []);
  const pool = EMOJI_ITEMS.filter((it) => !avoid.has(it.titulo));
  const src = pool.length ? pool : EMOJI_ITEMS;
  return src[Math.floor(Math.random() * src.length)];
}


const PICTONARY_COLORS = ['#0a0e2e', '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#78350f'];

// Dado de categoría: 5 categorías disponibles + 1 cara repetida para
// completar las 6 caras de un cubo.
const CATEGORY_DIE_FACES = ['Lugares', 'Personajes', 'Historias', 'Objetos', 'Verbos / Acciones', 'Personajes'];
// Dado de dificultad: 2 caras Fácil, 2 Mediano, 2 Difícil.
const DIFFICULTY_DIE_FACES = ['Fácil', 'Fácil', 'Mediano', 'Mediano', 'Difícil', 'Difícil'];

/* Cubo con 6 caras en CSS 3D real (perspective + preserve-3d). `resultIndex`
   (0-5) indica qué cara debe quedar al frente; cuando cambia, el cubo gira
   varias vueltas completas antes de asentarse — efecto de "tirar el dado". */
function DiceCube3D({ faces, resultIndex, size = 84 }) {
  const half = size / 2;
  const FACE_PLACEMENT = [
    { axis: 'y', deg: 0 },    // frente
    { axis: 'y', deg: 180 },  // atrás
    { axis: 'y', deg: 90 },   // derecha
    { axis: 'y', deg: -90 },  // izquierda
    { axis: 'x', deg: -90 },  // arriba
    { axis: 'x', deg: 90 },   // abajo
  ];
  // Para traer la cara i al frente, el cubo entero gira lo opuesto a su colocación.
  const OUTER = [{ x: 0, y: 0 }, { x: 0, y: 180 }, { x: 0, y: -90 }, { x: 0, y: 90 }, { x: 90, y: 0 }, { x: -90, y: 0 }];
  const spinRef = useRef(0);
  const [rot, setRot] = useState({ x: 0, y: 0 });
  useEffect(() => {
    if (resultIndex == null) return;
    spinRef.current += 1;
    const turns = 360 * (2 + (spinRef.current % 3));
    const target = OUTER[resultIndex] || OUTER[0];
    setRot({ x: target.x + turns, y: target.y + turns * 1.3 });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [resultIndex]);
  return h('div', { style: { width: size, height: size, perspective: 500 } },
    h('div', {
      style: {
        width: '100%', height: '100%', position: 'relative', transformStyle: 'preserve-3d',
        transform: `rotateX(${rot.x}deg) rotateY(${rot.y}deg)`,
        transition: 'transform 1.1s cubic-bezier(.34,1.56,.64,1)'
      }
    },
      faces.map((label, i) => {
        const fp = FACE_PLACEMENT[i];
        const t = fp.axis === 'y' ? `rotateY(${fp.deg}deg) translateZ(${half}px)` : `rotateX(${fp.deg}deg) translateZ(${half}px)`;
        return h('div', { key: i, style: { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: 4, background: '#fff', border: '2px solid #0a0e2e', borderRadius: 12, boxShadow: 'inset 0 0 10px rgba(10,14,46,.08)', transform: t, backfaceVisibility: 'hidden', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, fontSize: 11, color: '#0a0e2e', lineHeight: 1.1 } }, label);
      }),
    ),
  );
}

/* Pizarra en blanco con lienzo <canvas> real: soporta varios colores de
   lápiz y una goma de borrar de verdad (destination-out), sincronizada en
   vivo vía Firebase (igual que DibujaCanvas: puntos normalizados 0..1). */
function PictonaryCanvas({ SID, canDraw, color, tool, strokes, live, height = 320 }) {
  const canvasRef = useRef(null);
  const wrapRef = useRef(null);
  const curRef = useRef(null);
  const lastWriteRef = useRef(0);
  const drawingRef = useRef(false);
  const [localLive, setLocalLive] = useState(null);

  const paintStroke = (ctx, w, hgt, s) => {
    const pts = (s && s.points) || [];
    if (pts.length < 2) return;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = s.tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.tool === 'eraser' ? 'rgba(0,0,0,1)' : (s.color || '#0a0e2e');
    ctx.lineWidth = s.tool === 'eraser' ? 26 : 5;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = p.x * w, y = p.y * hgt;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  };
  const drawAll = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const w = canvas.width, hgt = canvas.height;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, w, hgt);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, hgt);
    const strokeArr = strokes ? Object.values(strokes) : [];
    strokeArr.forEach((s) => paintStroke(ctx, w, hgt, s));
    if (live && live.points) paintStroke(ctx, w, hgt, live);
    if (localLive && localLive.points) paintStroke(ctx, w, hgt, localLive);
    ctx.globalCompositeOperation = 'source-over';
  }, [strokes, live, localLive]);

  useEffect(() => { drawAll(); }, [drawAll]);

  useEffect(() => {
    const canvas = canvasRef.current, wrap = wrapRef.current;
    if (!canvas || !wrap || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => {
      const r = wrap.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(r.width));
      canvas.height = Math.max(1, Math.round(r.height));
      drawAll();
    });
    ro.observe(wrap);
    return () => ro.disconnect();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const getPt = (e) => {
    const r = canvasRef.current.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) / r.width, y: (p.clientY - r.top) / r.height };
  };
  const writeLive = () => {
    db.ref(`sessions/${SID}/pictonary/live`).set({ tool, color, points: curRef.current });
  };
  const start = (e) => {
    if (!canDraw) return;
    if (e.cancelable) e.preventDefault();
    drawingRef.current = true;
    curRef.current = [getPt(e)];
    setLocalLive({ tool, color, points: curRef.current });
    writeLive();
  };
  const move = (e) => {
    if (!canDraw || !drawingRef.current) return;
    if (e.cancelable) e.preventDefault();
    curRef.current.push(getPt(e));
    setLocalLive({ tool, color, points: [...curRef.current] });
    const now = Date.now();
    if (now - lastWriteRef.current > 70) {
      lastWriteRef.current = now;
      writeLive();
    }
  };
  const end = () => {
    if (!canDraw || !drawingRef.current) return;
    drawingRef.current = false;
    if (curRef.current && curRef.current.length > 1) {
      db.ref(`sessions/${SID}/pictonary/strokes`).push({ tool, color, points: curRef.current });
    }
    curRef.current = null;
    setLocalLive(null);
    db.ref(`sessions/${SID}/pictonary/live`).remove();
  };
  const empty = (!strokes || Object.keys(strokes).length === 0) && !live && !localLive;

  return h('div', { ref: wrapRef, style: { width: '100%', height, background: '#fff', borderRadius: 14, border: '3px solid #ffd000', overflow: 'hidden', position: 'relative', boxShadow: '0 12px 30px rgba(10,14,46,.18)' } },
    h('canvas', {
      ref: canvasRef,
      onMouseDown: start, onMouseMove: move, onMouseUp: end, onMouseLeave: end,
      onTouchStart: start, onTouchMove: move, onTouchEnd: end,
      style: { width: '100%', height: '100%', display: 'block', touchAction: canDraw ? 'none' : 'pan-y', cursor: canDraw ? (tool === 'eraser' ? 'cell' : 'crosshair') : 'default' }
    }),
    empty ? h('div', { style: { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#c9c4b8', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 15, letterSpacing: '.06em', textTransform: 'uppercase', pointerEvents: 'none' } }, canDraw ? '✏️ Dibuja aquí' : 'Esperando el dibujo...') : null,
  );
}

/* ═══ PICTONARY BÍBLICO — TABLERO POR EQUIPOS ═══ */
// "Pictonary Bíblico" es un juego de tablero por equipos: 2 equipos elegidos
// al azar (o armados a mano por el admin), capitanes que tiran el dado de
// movimiento, categorías según el color de la casilla (reutiliza
// PICTONARY_ITEMS, arriba) y un dado de dificultad que se tira solo al caer
// en una casilla. La pizarra sigue siendo el mismo lienzo libre de siempre
// (PictonaryCanvas, definido más arriba en este archivo).

function pictabSeededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => (s = s * 16807 % 2147483647) / 2147483647;
}
// Quita tildes/mayúsculas para comparar respuestas del chat sin importar
// cómo las tipeen ("Belen" === "Belén" === "BELÉN").
const pictabNormalize = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');

// Palabras que no cuentan para el "se acercó lo suficiente" (artículos,
// preposiciones, etc.) — así "la resurrección de Jesús" no exige adivinar
// "la"/"de" para llegar al 60%.
const PICTAB_STOPWORDS = new Set(['el', 'la', 'los', 'las', 'de', 'del', 'al', 'y', 'o', 'en', 'a', 'un', 'una', 'unos', 'unas', 'que', 'su', 'sus']);
// Qué porcentaje de las palabras clave de "target" aparecen en "candidate"
// (un solo mensaje). Se usa al acabarse el tiempo: si nadie adivinó exacto
// pero alguien escribió, en un único mensaje, al menos el 60% de las
// palabras de la frase, igual se le da como ganador.
function pictabWordMatchRatio(target, candidate) {
  const targetWords = pictabNormalize(target).split(' ').filter((w) => w && !PICTAB_STOPWORDS.has(w));
  if (!targetWords.length) return pictabNormalize(target) === pictabNormalize(candidate) ? 1 : 0;
  const candidateWords = new Set(pictabNormalize(candidate).split(' ').filter(Boolean));
  const matched = targetWords.filter((w) => candidateWords.has(w)).length;
  return matched / targetWords.length;
}
const PICTAB_CLOSE_ENOUGH_RATIO = 0.6;

const PICTAB_CATS = {
  verbos: { key: 'verbos', categoria: 'Verbos / Acciones', label: 'Acción bíblica', color: '#2ecc71', dark: '#1e8e4f', icon: '🏃' },
  lugares: { key: 'lugares', categoria: 'Lugares', label: 'Lugar bíblico', color: '#f39c12', dark: '#b9770e', icon: '📍' },
  personajes: { key: 'personajes', categoria: 'Personajes', label: 'Personaje bíblico', color: '#e74c3c', dark: '#a93226', icon: '🧑' },
  historias: { key: 'historias', categoria: 'Historias', label: 'Historia bíblica', color: '#3498db', dark: '#21618c', icon: '📖' },
  objetos: { key: 'objetos', categoria: 'Objetos', label: 'Objeto bíblico', color: '#8b5cf6', dark: '#5b21b6', icon: '📦' }
};
// Orden fijo del ciclo de colores del tablero — "parte con el verde".
const PICTAB_CAT_ORDER = ['verbos', 'lugares', 'personajes', 'historias', 'objetos'];

// 36 casillas: 6 por categoría (4 "sólo tu equipo adivina" + 2 "todos
// participan" con lápices cruzados), 5 casillas blancas (el capitán elige el
// color/categoría, sólo para su equipo) y una casilla final de todos los
// colores. El color de cada casilla sigue el ciclo fijo de categorías
// (verde, lugar, personaje, historia, objeto, y de nuevo verde…) para que el
// tablero quede realmente alternado — "parte con el verde y sigue así la
// secuencia" — y sólo las casillas "todos participan" quedan sorteadas al
// azar (semilla fija, así el tablero es igual para todos los que juegan).
const PICTAB_BOARD = (() => {
  const n = 35; // casillas de color/blancas antes de la meta
  const base = Array.from({ length: n }, (_, i) => PICTAB_CAT_ORDER[i % 5]);
  const rand = pictabSeededRandom(20260815);
  // Una casilla blanca por categoría, repartida lejos entre sí y sin tocar
  // nunca la casilla 0 (que debe quedar verde).
  const whiteIdx = new Set();
  PICTAB_CAT_ORDER.forEach((k, ki) => {
    const occurrences = [];
    for (let i = 0; i < n; i++) if (base[i] === k) occurrences.push(i);
    let pick = occurrences[(ki + 1) % occurrences.length];
    if (pick === 0) pick = occurrences[1];
    whiteIdx.add(pick);
  });
  // Dos casillas "todos participan" por categoría, sorteadas al azar entre
  // las que le quedan a cada color.
  const allIdx = new Set();
  PICTAB_CAT_ORDER.forEach((k) => {
    const occurrences = [];
    for (let i = 0; i < n; i++) if (base[i] === k && !whiteIdx.has(i)) occurrences.push(i);
    const shuffled = [...occurrences].sort(() => rand() - 0.5);
    shuffled.slice(0, 2).forEach((i) => allIdx.add(i));
  });
  const cells = base.map((cat, i) => whiteIdx.has(i) ? { cat: null, all: false, white: true } : { cat, all: allIdx.has(i) });
  cells.push({ finish: true });
  return cells.map((c, i) => Object.assign({ i: i }, c));
})();
const PICTAB_GOAL = PICTAB_BOARD.length - 1; // 35 → casilla 36 (índice 35)

const PICTAB_TEAM_AVATARS = ['🦁', '🐺', '🦊', '🐻', '🐼', '🦅', '🐬', '🦄'];
const PICTAB_TEAM_COLORS = ['#e74c3c', '#3498db'];
const PICTAB_TEAM_NAMES = ['Equipo Rojo', 'Equipo Azul'];
const PICTAB_MOVE_FACES = ['1', '2', '3', '4', '5', '6'];
const PICTAB_ROUND_SECONDS = 75;
const PICTAB_CAPTAIN_SECONDS = 15;

// Elige una carta para (categoría, dificultad), evitando repetir las últimas usadas.
function pictabPickItem(categoria, dificultad, history) {
  const avoid = new Set(history || []);
  const byBoth = PICTONARY_ITEMS.filter((it) => it.categoria === categoria && it.dificultad === dificultad && !avoid.has(it.titulo));
  if (byBoth.length) return byBoth[Math.floor(Math.random() * byBoth.length)];
  const byCat = PICTONARY_ITEMS.filter((it) => it.categoria === categoria && !avoid.has(it.titulo));
  if (byCat.length) return byCat[Math.floor(Math.random() * byCat.length)];
  const anyCat = PICTONARY_ITEMS.filter((it) => it.categoria === categoria);
  if (anyCat.length) return anyCat[Math.floor(Math.random() * anyCat.length)];
  return PICTONARY_ITEMS[Math.floor(Math.random() * PICTONARY_ITEMS.length)];
}

// Popup genérico (arriba, centrado) para avisos de transición ("se acabó el
// tiempo…") y para el aviso de "¡adivinaron!" — se auto-cierra solo y además
// tiene botón ✕ para cerrarlo antes.
function GameToast({ toast, ms = 3000, tone = 'info' }) {
  const [visible, setVisible] = useState(false);
  const seenTs = useRef(null);
  useEffect(() => {
    const ts = toast && toast.ts;
    if (!ts || ts === seenTs.current) return;
    seenTs.current = ts;
    setVisible(true);
    const t = setTimeout(() => setVisible(false), (toast && toast.ms) || ms);
    return () => clearTimeout(t);
  }, [toast && toast.ts]);
  if (!visible || !toast || !toast.text) return null;
  const bg = tone === 'success' ? 'linear-gradient(135deg,#22c55e,#15803d)' : 'linear-gradient(135deg,#0a0e2e,#1d2547)';
  return h('div', {
    style: {
      position: 'fixed', top: 18, left: '50%', transform: 'translateX(-50%)', zIndex: 500,
      background: bg, color: '#fff', padding: '12px 20px', borderRadius: 16,
      boxShadow: '0 12px 30px rgba(10,14,46,.35)', display: 'flex', alignItems: 'center', gap: 12,
      maxWidth: '92vw', fontFamily: 'Barlow Condensed,sans-serif'
    }
  },
    h('span', { style: { fontWeight: 800, fontSize: 14, letterSpacing: '.02em' } }, toast.text),
    h('button', {
      onClick: () => setVisible(false),
      style: { background: 'rgba(255,255,255,.18)', border: 'none', color: '#fff', borderRadius: '50%', width: 22, height: 22, cursor: 'pointer', fontSize: 13, lineHeight: 1, flexShrink: 0 }
    }, '✕')
  );
}

/* Casilla individual del tablero: color de categoría, lápices cruzados para
   "todos participan", círculo de 5 colores para las blancas, arcoíris +
   estrella para la meta. */
function PictabSquare({ sq, here, size }) {
  let bg = '#fff', border = 'rgba(10,14,46,.12)', content = null;
  if (sq.finish) {
    bg = 'conic-gradient(#2ecc71,#f39c12,#e74c3c,#3498db,#8b5cf6,#2ecc71)';

    border = '#e5e0d3';
    content = h('div', {
      style: {
        width: '62%', height: '62%', borderRadius: '50%',
        background: 'conic-gradient(#2ecc71 0 20%,#f39c12 20% 40%,#e74c3c 40% 60%,#3498db 60% 80%,#8b5cf6 80% 100%)',
        boxShadow: 'inset 0 0 0 2px rgba(255,255,255,.7)'
      }
    });

        h('span', { style: { position: 'absolute', top: '50%', left: '50%', fontSize: size * .8, transform: 'translate(-50%,-50%) rotate(-45deg) scaleX(-1)', filter: 'drop-shadow(0 1px 1px rgba(0,0,0,.35))' } }, '✏️'),
      );

  }
  return h('div', {

    }

  );

/* Tablero serpenteante (6 columnas, filas alternadas) con 36 casillas —
   "camino con curvas" tipo Pictionary, con relieve para el efecto 3D. */
function PictabBoard({ teams, order }) {
  const cols = 6;
  const size = 42;
  const gap = 6;
  const rows = Math.ceil(PICTAB_BOARD.length / cols);
  const width = cols * size + (cols - 1) * gap;
  const height = rows * size + (rows - 1) * gap;
  const startTeams = order.map((tid) => teams[tid]).filter((t) => t && (t.pos == null || t.pos < 0));
  return h('div', {
    style: {
      background: 'linear-gradient(160deg,#ffd000,#f97316)', borderRadius: 20, padding: 14,
      boxShadow: '0 16px 34px rgba(10,14,46,.26)', display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'center'
    }
  },
    h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
      h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 17, color: '#0a4d8c', letterSpacing: '.04em', textShadow: '0 1px 0 rgba(255,255,255,.5)' } }, 'PICTONARY BÍBLICO'),
      h('span', { style: { fontSize: 16 } }, '🎨'),
    ),
    startTeams.length > 0 && h('div', {
      style: {
        display: 'flex', alignItems: 'center', gap: 6, background: 'rgba(255,255,255,.85)', borderRadius: 20,
        padding: '4px 12px', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, fontSize: 11, color: '#0a0e2e'
      }
    }, '🚪 Salida:', startTeams.map((t, i) => h('span', { key: i, style: { fontSize: 16 } }, t.avatar))),
    h('div', { style: { position: 'relative', width, height } },
      PICTAB_BOARD.map((sq, idx) => {
        const row = Math.floor(idx / cols);
        const inRow = idx % cols;
        const col = row % 2 === 0 ? inRow : (cols - 1 - inRow);
        const left = col * (size + gap);
        const top = height - (row + 1) * size - row * gap; // casilla 0 abajo, meta arriba
        const here = order.map((tid) => teams[tid]).filter((t) => t && t.pos === idx);
        return h('div', { key: idx, style: { position: 'absolute', left, top } }, h(PictabSquare, { sq, here, size }));
      })
    ),
    h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 6, justifyContent: 'center' } },
      PICTAB_CAT_ORDER.map((k) => h('span', {
        key: k, style: {
          display: 'flex', alignItems: 'center', gap: 4, background: 'rgba(255,255,255,.85)', borderRadius: 20,
          padding: '2px 8px', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 9, color: '#0a0e2e'
        }
      }, h('span', { style: { width: 9, height: 9, borderRadius: 3, background: PICTAB_CATS[k].color } }), PICTAB_CATS[k].label)),
      h('span', { style: { display: 'flex', alignItems: 'center', gap: 4, background: 'rgba(255,255,255,.85)', borderRadius: 20, padding: '2px 8px', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 9, color: '#0a0e2e' } }, '✏️✏️ Todos participan'),
      h('span', { style: { display: 'flex', alignItems: 'center', gap: 4, background: 'rgba(255,255,255,.85)', borderRadius: 20, padding: '2px 8px', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 9, color: '#0a0e2e' } }, '⚪ El capitán elige color'),
    ),
  );
}

/* Ordena a los miembros de un equipo de forma estable (mismo orden para
   todos) — "el primero de la lista" dibuja primero y se va turnando hacia
   abajo a medida que avanza el juego. */
function pictabTeamMemberList(team, users) {
  return Object.keys((team && team.members) || {})
    .map((uid) => Object.assign({ uid }, users[uid] || {}))
    .filter((u) => u.name)
    .sort((a, b) => a.name.localeCompare(b.name));
}
function pictabTeamDrawer(team, users) {
  const list = pictabTeamMemberList(team, users);
  if (!list.length) return null;
  return list[(team.drawerIdx || 0) % list.length].uid;
}

/* Franja de jugadores (ambos equipos) — siempre visible para saber quiénes
   están jugando; el admin puede reasignar el capitán tocando a cualquiera. */
function PictabRoster({ teams, order, users, myId, isAdmin, onSetCaptain }) {
  return h('div', { style: { width: '100%', maxWidth: 760, display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center' } },
    order.map((tid) => {
      const team = teams[tid] || {};
      const list = pictabTeamMemberList(team, users);
      return h('div', {
        key: tid, style: {
          flex: '1 1 320px', minWidth: 260, background: `${team.color}14`, border: `1px solid ${team.color}55`,
          borderRadius: 14, padding: '8px 10px'
        }
      },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 } },
          h('span', { style: { fontSize: 18 } }, team.avatar),
          h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 13, color: team.color, flex: 1 } }, team.name),
          h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 13, color: '#a16207' } }, team.points || 0, ' pts'),
        ),
        h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 4 } },
          list.length === 0 ? h('span', { style: { fontSize: 11, color: 'var(--muted)' } }, 'Sin jugadores') :
          list.map((u) => h('span', {
            key: u.uid, onClick: isAdmin && onSetCaptain ? () => onSetCaptain(tid, u.uid) : undefined,
            title: isAdmin ? 'Tocar para hacerlo/a capitán/a' : undefined,
            style: {
              display: 'flex', alignItems: 'center', gap: 4, background: u.uid === myId ? 'rgba(255,208,0,.22)' : 'rgba(10,14,46,.06)',
              border: team.captain === u.uid ? '1px solid #ffd000' : '1px solid transparent',
              borderRadius: 20, padding: '2px 8px 2px 3px', fontSize: 11.5, color: '#0a0e2e',
              fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, cursor: isAdmin ? 'pointer' : 'default'
            }
          }, h(AvatarBubble, { profile: u, size: 18 }), team.captain === u.uid ? '👑 ' : '', u.name)),
        ),
      );
    })
  );
}

function PictabSetup({ game, SID, users, juegosUsers, onCancel, onContinue }) {

    if (!game || !game.active) return;
    if (game.teams) return;
    const t = {};
    order.forEach((tid, i) => {
      t[tid] = { name: PICTAB_TEAM_NAMES[i], avatar: PICTAB_TEAM_AVATARS[i], color: PICTAB_TEAM_COLORS[i], members: {}, captain: null, pos: -1, drawerIdx: 0, points: 0 };

    h('div', { style: { textAlign: 'center' } },

        return h('div', { key: tid, style: { background: `${PICTAB_TEAM_COLORS[t]}1a`, border: `1px solid ${PICTAB_TEAM_COLORS[t]}55`, borderRadius: 12, padding: '8px 10px' } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
            h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 14, color: PICTAB_TEAM_COLORS[t], width: 92, flexShrink: 0 } }, team.name || PICTAB_TEAM_NAMES[t]),
            h('div', { style: { display: 'flex', gap: 4, flexWrap: 'wrap', flex: 1 } },
              PICTAB_TEAM_AVATARS.map((av) => h('button', { key: av, onClick: () => setAvatar(t, av), style: { width: 26, height: 26, borderRadius: 8, fontSize: 14, cursor: 'pointer', border: team.avatar === av ? '2px solid #ffd000' : '1px solid rgba(10,14,46,.15)', background: team.avatar === av ? 'rgba(255,208,0,.2)' : 'rgba(10,14,46,.05)' } }, av)),

    h('div', { style: { width: '100%', maxWidth: 420, display: 'flex', gap: 8, marginTop: 4 } },
      h('button', { onClick: onCancel, style: { flex: 1, padding: '13px', borderRadius: 12, border: '1px solid rgba(10,14,46,.12)', background: 'rgba(10,14,46,.05)', color: 'var(--muted)', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 13, letterSpacing: '.04em', textTransform: 'uppercase', cursor: 'pointer' } }, 'Cancelar'),
      h('button', { onClick: onContinue, disabled: !bothHaveMembers, style: { flex: 2, padding: '13px', borderRadius: 12, border: 'none', cursor: bothHaveMembers ? 'pointer' : 'not-allowed', background: bothHaveMembers ? 'linear-gradient(135deg,#ffd000,#e6a800)' : 'rgba(10,14,46,.1)', color: bothHaveMembers ? '#0a0e2e' : 'var(--muted)', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 14, letterSpacing: '.05em', textTransform: 'uppercase' } }, bothHaveMembers ? '👑 Elegir capitanes →' : 'Asigna jugadores a ambos equipos'),
    ),
  );
}

/* ── PictabCaptains — cada equipo elige capitán (15s, si no se sortea) ── */
function PictabCaptains({ game, SID, users, myId, isAdmin }) {
  const ref = () => db.ref(`sessions/${SID}/pictonary`);
  const order = game.order || [];
  const teams = game.teams || {};
  const deadline = game.captainsDeadline;
  const [left, setLeft] = useState(PICTAB_CAPTAIN_SECONDS);

  useEffect(() => {
    if (!deadline) { ref().update({ captainsDeadline: Date.now() + PICTAB_CAPTAIN_SECONDS * 1000 }); return; }
    const iv = setInterval(() => { setLeft(Math.max(0, Math.ceil((deadline - Date.now()) / 1000))); }, 250);
    return () => clearInterval(iv);
  }, [deadline]);

  useEffect(() => {
    if (!isAdmin || !deadline || Date.now() < deadline) return;
    const missing = order.filter((tid) => teams[tid] && !teams[tid].captain && Object.keys(teams[tid].members || {}).length > 0);
    if (!missing.length) return;
    const updates = {};
    missing.forEach((tid) => {
      const members = Object.keys(teams[tid].members);
      updates[`teams/${tid}/captain`] = members[Math.floor(Math.random() * members.length)];
    });
    ref().update(updates);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [left, isAdmin, deadline]);

  const claim = (tid, uid) => { db.ref(`sessions/${SID}/pictonary/teams/${tid}/captain`).transaction((cur) => cur || uid); };
  const bothReady = order.length > 0 && order.every((tid) => teams[tid] && teams[tid].captain);
  const comenzar = () => ref().update({ gameState: 'playing', turnIdx: Math.random() < 0.5 ? 0 : 1, phase: 'ready', scores: game.scores || {}, history: [] });

  return h('div', { style: { position: 'fixed', inset: 0, zIndex: 250, background: '#f8f5ef', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '20px 16px', gap: 14, overflowY: 'auto' } },
    h('div', { style: { textAlign: 'center' } },
      h('div', { style: { fontSize: 40 } }, '👑'),
      h('h2', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 24, color: '#a16207', textTransform: 'uppercase', letterSpacing: '.05em', margin: 0 } }, 'Elijan a su capitán'),
      h('p', { style: { color: 'var(--muted)', fontSize: 13, marginTop: 4 } }, bothReady ? '¡Listo!' : `${left}s para elegir — si no, se sortea al azar`),
    ),
    h('div', { style: { width: '100%', maxWidth: 420, display: 'flex', flexDirection: 'column', gap: 10 } },
      order.map((tid) => {
        const team = teams[tid] || {};
        const members = Object.keys(team.members || {}).map((uid) => Object.assign({ uid }, users[uid] || {})).filter((u) => u.name);
        return h('div', { key: tid, style: { background: `${team.color}1a`, border: `1px solid ${team.color}55`, borderRadius: 14, padding: '12px 14px' } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 } },
            h('span', { style: { fontSize: 20 } }, team.avatar),
            h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 15, color: team.color, flex: 1 } }, team.name),
            team.captain ? h('span', { style: { fontSize: 12, fontWeight: 800, color: '#a16207' } }, '👑 ', (users[team.captain] && users[team.captain].name) || '') : null,
          ),
          h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 6 } },
            members.map((u) => h('button', {
              key: u.uid, onClick: () => claim(tid, u.uid), disabled: !!team.captain,
              style: {
                display: 'flex', alignItems: 'center', gap: 6, padding: '6px 10px', borderRadius: 20, cursor: team.captain ? 'default' : 'pointer',
                border: team.captain === u.uid ? '2px solid #ffd000' : '1px solid rgba(10,14,46,.15)',
                background: team.captain === u.uid ? 'rgba(255,208,0,.2)' : '#fff', opacity: team.captain && team.captain !== u.uid ? .5 : 1
              }
            }, h(AvatarBubble, { profile: u, size: 20 }), u.name, u.uid === myId ? ' (tú)' : '')),
          ),
        );
      })
    ),
    isAdmin ? h('button', {
      onClick: comenzar, disabled: !bothReady,
      style: { width: '100%', maxWidth: 420, padding: '13px', borderRadius: 12, border: 'none', cursor: bothReady ? 'pointer' : 'not-allowed', background: bothReady ? 'linear-gradient(135deg,#ffd000,#e6a800)' : 'rgba(10,14,46,.1)', color: bothReady ? '#0a0e2e' : 'var(--muted)', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 14, letterSpacing: '.05em', textTransform: 'uppercase' }
    }, bothReady ? '🎨 ¡Comenzar partida!' : 'Esperando capitanes…') : (bothReady ? h('div', { style: { color: 'var(--muted)', fontSize: 13 } }, 'Esperando que el anfitrión inicie…') : null),
  );
}

/* ── PictonaryController — juego completo (tablero por equipos) ── */
function PictabTableroGame({ session, users, myId, isAdmin, SID, onClose }) {
  const game = session?.pictonary || {};
  const gState = game.gameState;
  const juegosUsers = Object.entries(users || {}).filter(([uid, u]) => effectiveZone(u) === 'juegos' || (isAdmin && uid === myId)).map(([uid, u]) => ({ uid, ...u }));
  const ref = () => db.ref(`sessions/${SID}/pictonary`);
  const isMobile = useIsMobile();
  const cerrar = async () => {
    // Primero avisamos a todo el mundo que la fase terminó (eso hace que
    // cada cliente cierre su propia pantalla del juego) y recién después
    // borramos los datos — si se borra primero, algún cliente que todavía
    // tiene la pantalla de armar equipos montada puede alcanzar a leer
    // "no hay juego" y volver a crear un esqueleto de equipos vacío justo
    // cuando se supone que estamos cerrando.
    if (onClose) onClose();
    await db.ref(`sessions/${SID}`).update({ phase: 'waiting' });
    await db.ref(`sessions/${SID}/pictonary`).remove();
  };

  const myZone = effectiveZone(users[myId]);
  const blocked = myZone !== 'juegos' && !isAdmin;

  const wrapStyle = { position: 'fixed', inset: 0, zIndex: 250, background: '#f8f5ef', display: 'flex', flexDirection: 'column', overflow: 'hidden' };
  const headerBar = h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, padding: '12px 16px', borderBottom: '1px solid rgba(10,14,46,.08)', flexShrink: 0 } },
    h('span', { style: { fontSize: 22 } }, '🎨'),
    h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 18, color: '#15803d', textTransform: 'uppercase', letterSpacing: '.05em', flex: 1 } }, 'Pictonary Bíblico · Tablero'),
    isAdmin ? h('button', { onClick: cerrar, title: 'Cerrar juego', style: { border: 'none', background: 'rgba(239,68,68,.12)', color: '#dc2626', borderRadius: 20, padding: '6px 14px', fontWeight: 800, fontSize: 12, fontFamily: 'Barlow Condensed,sans-serif', letterSpacing: '.04em', textTransform: 'uppercase', cursor: 'pointer' } }, '✕ Cerrar') : null,
  );

  // NOTA IMPORTANTE: acá NO se puede hacer `return` todavía (ni por zona, ni
  // por gState) — React exige llamar exactamente los mismos hooks, en el
  // mismo orden, en cada render de este mismo componente. Como más abajo se
  // usan useTimer/useState/useRef/useEffect, cortar la función acá antes de
  // llegar a esos hooks hacía que, al pasar de "armando equipos" a "jugando",
  // este mismo componente llamara de golpe muchos hooks más que en el
  // render anterior → React tiraba una excepción y la pantalla quedaba en
  // blanco. Por eso los `return` de zona/armado/capitanes se movieron a
  // después de declarar todos los hooks (ver más abajo).
  const order = game.order || [];
  const teams = game.teams || {};
  const turnIdx = game.turnIdx || 0;
  const turnTeamId = order[turnIdx];
  const turnTeam = teams[turnTeamId];
  const phase = game.phase || 'ready';
  const captainUid = turnTeam?.captain;
  const isCaptain = captainUid === myId;
  const myTeamId = order.find((tid) => teams[tid]?.members?.[myId]);
  const currentDrawerId = game.currentDrawer;
  const currentDrawer = currentDrawerId ? users[currentDrawerId] : null;
  const isDrawer = currentDrawerId === myId;
  const currentItem = game.currentItem;
  const allPlay = !!game.allPlay;
  const isFinal = !!game.isFinal;
  const currentCategoryKey = game.currentCategoryKey;
  const currentCatMeta = currentCategoryKey ? PICTAB_CATS[currentCategoryKey] : null;
  const scores = game.scores || {};
  const { remaining, over } = useTimer(phase === 'draw' ? game.roundStartTime : null, PICTAB_ROUND_SECONDS);
  const [color, setColor] = useState(PICTONARY_COLORS[0]);
  const [tool, setTool] = useState('pen');
  const [chatText, setChatText] = useState('');
  const [chatExpanded, setChatExpanded] = useState(false);
  const chatListRef = useRef(null);
  const lastCheckedRef = useRef(null);
  const timeoutFiredRef = useRef(null);

  const chat = game.chat ? Object.entries(game.chat).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.ts || 0) - (b.ts || 0)) : [];
  // Sólo hace auto-scroll DENTRO de la cajita del chat (nunca de toda la
  // pantalla) y sólo si ya estabas mirando el final — así a quien está
  // dibujando no se le arrastra la vista cada vez que alguien escribe.
  useEffect(() => {
    const el = chatListRef.current;
    if (!el) return;
    const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    if (!nearBottom) return;
    const t = setTimeout(() => { if (chatListRef.current) chatListRef.current.scrollTop = chatListRef.current.scrollHeight; }, 60);
    return () => clearTimeout(t);
  }, [chat.length]);
  useEffect(() => { if (!isDrawer) setTool('pen'); }, [isDrawer, currentDrawerId]);

  /* Mueve el dado de movimiento: sólo el capitán del equipo en turno (o el admin). */
  const tirarMovimiento = async () => {
    if (!(isCaptain || isAdmin) || phase !== 'ready' || game.moveRoll) return;
    const move = 1 + Math.floor(Math.random() * 6);
    await ref().update({ moveRoll: { value: move, ts: Date.now() } });
    setTimeout(async () => {
      const cur = turnTeam.pos == null ? -1 : turnTeam.pos;
      const next = Math.min(PICTAB_GOAL, cur + move);
      const cell = PICTAB_BOARD[next];
      const updates = {};
      updates[`teams/${turnTeamId}/pos`] = next;
      if (next === PICTAB_GOAL) {
        const randomCat = PICTAB_CAT_ORDER[Math.floor(Math.random() * PICTAB_CAT_ORDER.length)];
        updates.phase = 'difficulty'; updates.isFinal = true; updates.allPlay = false;
        updates.currentCategoryKey = randomCat; updates.chosenCat = null; updates.difficultyRoll = null;
        await ref().update(updates);
        ref().child('toast').set({ text: `🏁 ¡${turnTeam.name} llegó a la meta! Última prueba para ganar…`, ts: Date.now(), ms: 3500 });
      } else if (cell.white) {
        updates.phase = 'choose'; updates.isFinal = false; updates.allPlay = false;
        updates.currentCategoryKey = null; updates.difficultyRoll = null;
        await ref().update(updates);
        ref().child('toast').set({ text: `⚪ Casilla libre — el capitán de ${turnTeam.name} elige la categoría`, ts: Date.now() });
      } else {
        updates.phase = 'difficulty'; updates.isFinal = false; updates.allPlay = !!cell.all;
        updates.currentCategoryKey = cell.cat; updates.chosenCat = null; updates.difficultyRoll = null;
        await ref().update(updates);
        const catLabel = PICTAB_CATS[cell.cat]?.label || '';
        ref().child('toast').set({ text: cell.all ? `✏️✏️ ¡Cayó en ${catLabel}! Todos participan` : `🎯 ${turnTeam.name} cayó en ${catLabel} — sólo su equipo adivina`, ts: Date.now() });
      }
    }, 900);
  };

  const elegirColorBlanco = async (key) => {
    if (!(isCaptain || isAdmin) || phase !== 'choose') return;
    await ref().update({ currentCategoryKey: key, chosenCat: key, phase: 'difficulty', allPlay: false });
    ref().child('toast').set({ text: `🎨 Categoría elegida: ${PICTAB_CATS[key].label}`, ts: Date.now() });
  };

  /* Auto: al entrar en "difficulty" el capitán (o el admin) tira el dado solo. */
  useEffect(() => {
    if (phase !== 'difficulty' || game.difficultyRoll || !currentCategoryKey) return;
    if (!(isCaptain || isAdmin)) return;
    const idx = Math.floor(Math.random() * DIFFICULTY_DIE_FACES.length);
    ref().update({ difficultyRoll: { index: idx, value: DIFFICULTY_DIE_FACES[idx], ts: Date.now() } });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [phase, !!game.difficultyRoll, currentCategoryKey, isCaptain, isAdmin]);

  /* Auto: una vez tirado el dado de dificultad, se elige la carta y arranca el dibujo. */
  useEffect(() => {
    if (phase !== 'difficulty' || !game.difficultyRoll || game.currentItem) return;
    if (!(isCaptain || isAdmin)) return;
    const t = setTimeout(() => {
      const meta = PICTAB_CATS[game.currentCategoryKey];
      if (!meta) return;
      const item = pictabPickItem(meta.categoria, game.difficultyRoll.value, game.history);
      const history = [...(game.history || []), item.titulo].slice(-10);
      const drawer = pictabTeamDrawer(turnTeam, users);
      ref().update({
        currentItem: item, history, currentDrawer: drawer, roundStartTime: Date.now(),
        phase: 'draw', strokes: null, live: null, chat: null, solvedBy: null
      });
    }, 1100);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [phase, game.difficultyRoll?.ts, !!game.currentItem, isCaptain, isAdmin]);

  /* Detección automática de la respuesta correcta en el chat — sin tildes ni
     mayúsculas — sólo de quienes tienen permitido adivinar en esta ronda. */
  useEffect(() => {
    if (phase !== 'draw' || !currentItem) return;
    const last = chat[chat.length - 1];
    if (!last || last.id === lastCheckedRef.current) return;
    lastCheckedRef.current = last.id;
    if (last.uid === currentDrawerId) return;
    const senderTeamId = order.find((tid) => teams[tid]?.members?.[last.uid]);
    const allowed = allPlay ? !!senderTeamId : senderTeamId === turnTeamId;
    if (!allowed) return;
    if (pictabNormalize(last.text) === pictabNormalize(currentItem.titulo)) {
      resolverAdivinanza(senderTeamId, last.uid, last.name);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [chat.length, phase, currentItem?.titulo]);

  const resolverAdivinanza = async (winnerTid, guesserUid, guesserName, near) => {
    const myToken = `${guesserUid}|${Date.now()}|${Math.random()}`;
    const lockRes = await ref().child('solvedBy').transaction((cur) => cur || myToken);
    if (!lockRes.committed || lockRes.snapshot.val() !== myToken) return;

    const item = currentItem;
    const drawerUid = currentDrawerId;
    const newScores = { ...scores };
    newScores[guesserUid] = (newScores[guesserUid] || 0) + 15;
    if (drawerUid) newScores[drawerUid] = (newScores[drawerUid] || 0) + 5;
    const verbo = near ? 'se acercó lo suficiente a' : 'adivinó';

    if (isFinal) {
      Object.keys(teams[winnerTid]?.members || {}).forEach((uid) => { newScores[uid] = (newScores[uid] || 0) + 50; });

        scores: newScores,
        gameState: 'finished', winner: winnerTid,
        correctGuess: { text: `🎉 ¡${guesserName} ${verbo} "${item.titulo}"! ${teams[winnerTid]?.name} gana la partida`, ts: Date.now(), ms: 4000 }
      };

      await ref().update(updates);
      await saveGameHistory(SID, newScores, users);
      return;
    }

    const updates = { scores: newScores };
    updates[`teams/${winnerTid}/points`] = (teams[winnerTid]?.points || 0) + 20;
    updates[`teams/${turnTeamId}/drawerIdx`] = ((turnTeam.drawerIdx || 0) + 1) % Math.max(1, pictabTeamMemberList(turnTeam, users).length);
    updates.turnIdx = order.indexOf(winnerTid);
    updates.phase = 'ready';
    updates.moveRoll = null; updates.chosenCat = null; updates.difficultyRoll = null;
    updates.currentCategoryKey = null; updates.currentItem = null; updates.currentDrawer = null;
    updates.roundStartTime = null; updates.strokes = null; updates.live = null; updates.chat = null;
    updates.allPlay = false; updates.isFinal = false; updates.solvedBy = null;
    updates.correctGuess = { text: `🎉 ¡${guesserName} ${verbo} "${item.titulo}"! (${teams[winnerTid]?.name})`, ts: Date.now(), ms: 4000 };
    await ref().update(updates);
  };

  /* Si se acaba el tiempo sin que adivinen exacto, revisa si alguien se

  useEffect(() => {
    if (phase !== 'draw' || !over || !game.roundStartTime) return;

    if (currentItem) {
      const allowedChat = chat.filter((m) => {
        if (m.uid === currentDrawerId) return false;
        const senderTeamId = order.find((tid) => teams[tid]?.members?.[m.uid]);
        return allPlay ? !!senderTeamId : senderTeamId === turnTeamId;
      });
      let best = null;
      allowedChat.forEach((m) => {
        const ratio = pictabWordMatchRatio(currentItem.titulo, m.text);
        if (ratio >= PICTAB_CLOSE_ENOUGH_RATIO && (!best || ratio > best.ratio)) best = { ratio, m };
      });
      if (best) {
        const senderTeamId = order.find((tid) => teams[tid]?.members?.[best.m.uid]);
        resolverAdivinanza(senderTeamId, best.m.uid, best.m.name, true);
        return;
      }
    }

    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [phase, over, game.roundStartTime]);

  const seAcaboTiempo = async () => {
    const lockRes = await ref().child('solvedBy').transaction((cur) => cur || 'timeout');
    if (!lockRes.committed || lockRes.snapshot.val() !== 'timeout') return;
    const updates = {};
    updates[`teams/${turnTeamId}/drawerIdx`] = ((turnTeam.drawerIdx || 0) + 1) % Math.max(1, pictabTeamMemberList(turnTeam, users).length);
    updates.turnIdx = (turnIdx + 1) % order.length;
    updates.phase = 'ready';

    await ref().update(updates);

    if (!t || !SID || !canSendChat) return;

    db.ref(`sessions/${SID}/pictonary/chat`).push({ uid: myId, name: me.name || 'Anon', avatar: me.avatar || '👤', color: me.color || '#ffd000', text: t, ts: Date.now() }).catch(() => {});

  return h('div', { style: wrapStyle },

    h(GameToast, { toast: game.correctGuess, ms: 4000, tone: 'success' }),
    h(GameToast, { toast: game.toast, ms: 3000, tone: 'info' }),

        h('span', { style: { fontSize: 18 } }, turnTeam.avatar),
        h('div', null,
          h('div', { style: { fontSize: 9, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.1em' } }, 'Turno de'),
          h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 14, color: turnTeam.color } }, turnTeam.name),
        ),
      ) : null,
      captainUid && users[captainUid] ? h('div', { style: { display: 'flex', alignItems: 'center', gap: 6, background: 'rgba(255,208,0,.14)', border: '1px solid rgba(255,208,0,.4)', padding: '4px 10px', borderRadius: 20, fontSize: 11.5, fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, color: '#a16207' } }, '👑 ', users[captainUid].name) : null,

        h('span', { style: { fontSize: 10, fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.1em' } }, 'Categoría'),
        h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 14, color: currentCatMeta.dark, textTransform: 'uppercase' } }, currentCatMeta.icon, ' ', currentCatMeta.label),
      ) : null,
      game.difficultyRoll ? h('div', { style: { fontSize: 10, fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, color: dificultadColor, textTransform: 'uppercase', letterSpacing: '.1em', background: `${dificultadColor}1a`, padding: '4px 10px', borderRadius: 20 } }, game.difficultyRoll.value) : null,
      allPlay ? h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, fontSize: 12, color: '#dc2626', textTransform: 'uppercase', letterSpacing: '.05em', background: 'rgba(239,68,68,.12)', padding: '5px 12px', borderRadius: 20 } }, '✏️✏️ Todos participan') : null,
      isFinal ? h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 12, color: '#a16207', textTransform: 'uppercase', letterSpacing: '.05em', background: 'rgba(255,208,0,.2)', padding: '5px 12px', borderRadius: 20 } }, '🏁 ¡Ronda final!') : null,
      phase === 'draw' ? h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 28, color: timeColor, lineHeight: 1, marginLeft: 'auto' } }, formatTime(Math.max(0, remaining))) : null,
      isAdmin ? h('button', { onClick: finalizar, title: 'Terminar el juego ahora', style: { border: 'none', background: 'rgba(10,14,46,.06)', color: 'var(--muted)', borderRadius: 20, padding: '5px 12px', fontWeight: 700, fontSize: 11, fontFamily: 'Barlow Condensed,sans-serif', letterSpacing: '.04em', textTransform: 'uppercase', cursor: 'pointer', marginLeft: phase === 'draw' ? 0 : 'auto' } }, '🏆 Finalizar') : null,
    ),
    h('div', { style: { padding: '0 16px 8px', flexShrink: 0 } }, h(PictabRoster, { teams, order, users, myId, isAdmin, onSetCaptain: setCaptain })),
    h('div', { style: { flex: 1, display: 'flex', flexDirection: isMobile ? 'column' : 'row', gap: 14, padding: '0 16px 16px', overflow: 'auto', minHeight: 0 } },
      h('div', { style: { flex: isMobile ? 'none' : 2, display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'center', minHeight: 0 } },

        phase === 'ready' ? h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 } },
          (isCaptain || isAdmin) ? h('button', { onClick: tirarMovimiento, style: { padding: '12px 26px', background: turnTeam?.color || '#ffd000', border: 'none', borderRadius: 20, color: '#fff', fontWeight: 900, fontSize: 14, fontFamily: 'Barlow Condensed,sans-serif', letterSpacing: '.05em', textTransform: 'uppercase', cursor: 'pointer', boxShadow: '0 8px 20px rgba(10,14,46,.2)' } }, '🎲 Tirar dado y avanzar')
            : h('div', { style: { color: 'var(--muted)', fontSize: 13, fontStyle: 'italic' } }, `Esperando a que ${captainUid && users[captainUid] ? users[captainUid].name : 'el capitán'} tire el dado…`),

          h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 12, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.1em' } }, 'El capitán elige la categoría'),
          h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap', justifyContent: 'center' } },
            PICTAB_CAT_ORDER.map((k) => h('button', {
              key: k, onClick: () => elegirColorBlanco(k), disabled: !(isCaptain || isAdmin),
              style: { display: 'flex', alignItems: 'center', gap: 6, padding: '8px 14px', borderRadius: 20, border: 'none', cursor: (isCaptain || isAdmin) ? 'pointer' : 'not-allowed', background: PICTAB_CATS[k].color, color: '#fff', fontWeight: 800, fontSize: 12, fontFamily: 'Barlow Condensed,sans-serif', opacity: (isCaptain || isAdmin) ? 1 : .6 }

          game.moveRoll ? h('div', { style: { textAlign: 'center' } }, h(DiceCube3D, { faces: PICTAB_MOVE_FACES, resultIndex: game.moveRoll.value - 1, size: 60 }), h('div', { style: { fontSize: 9, color: 'var(--muted)', marginTop: 3, textTransform: 'uppercase', letterSpacing: '.08em' } }, 'Movimiento')) : null,
          h('div', { style: { textAlign: 'center' } }, h(DiceCube3D, { faces: DIFFICULTY_DIE_FACES, resultIndex: game.difficultyRoll?.index, size: 68 }), h('div', { style: { fontSize: 9, color: 'var(--muted)', marginTop: 3, textTransform: 'uppercase', letterSpacing: '.08em' } }, 'Dificultad')),

            h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 17, color: '#0a0e2e' } }, currentItem.titulo),

          h('button', { onClick: limpiarPizarra, title: 'Limpiar toda la pizarra', style: { display: 'flex', alignItems: 'center', gap: 6, padding: '6px 12px', borderRadius: 20, border: '1px solid rgba(239,68,68,.35)', background: 'rgba(239,68,68,.08)', cursor: 'pointer', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, fontSize: 12, textTransform: 'uppercase', letterSpacing: '.04em', color: '#dc2626' } }, '🗑️ Limpiar todo'),

        isAdmin && phase === 'draw' && currentDrawer ? h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center', justifyContent: 'center', background: 'rgba(10,14,46,.03)', borderRadius: 14, padding: 8, width: '100%', maxWidth: 420 } },
          h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 10, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.1em' } }, '🎯 Cambiar quién dibuja:'),
          h('button', { onClick: setDrawerRandom, style: { display: 'flex', alignItems: 'center', gap: 4, background: 'rgba(139,92,246,.14)', border: '1px solid rgba(139,92,246,.4)', borderRadius: 20, padding: '3px 10px', cursor: 'pointer', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, fontSize: 11, color: '#6d28d9' } }, '🎲 Al azar'),
          pictabTeamMemberList(turnTeam, users).map((u) => h('button', { key: u.uid, onClick: () => setDrawerManual(u.uid), style: { display: 'flex', alignItems: 'center', gap: 4, background: u.uid === currentDrawerId ? 'rgba(255,208,0,.25)' : '#fff', border: u.uid === currentDrawerId ? '1px solid #ffd000' : '1px solid rgba(10,14,46,.12)', borderRadius: 20, padding: '3px 8px 3px 3px', cursor: 'pointer', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 11, color: '#0a0e2e' } }, h(AvatarBubble, { profile: u, size: 18 }), u.name)),

        h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', borderBottom: '1px solid rgba(10,14,46,.08)', flexShrink: 0 } },
          h('span', { style: { flex: 1, fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, fontSize: 12, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.1em' } }, '💬 Adivina aquí'),
          h('button', {
            onClick: () => setChatExpanded((v) => !v),
            style: { border: 'none', background: 'rgba(10,14,46,.06)', borderRadius: 20, padding: '4px 10px', fontSize: 11, fontWeight: 800, cursor: 'pointer', color: '#0a0e2e', fontFamily: 'Barlow Condensed,sans-serif' }
          }, chatExpanded ? '🗕 Achicar' : '🗖 Agrandar'),
        ),
        h('div', { ref: chatListRef, style: { flex: 1, overflowY: 'auto', padding: '8px 10px', display: 'flex', flexDirection: 'column', gap: 6 } },
          chat.length === 0 ? h('div', { style: { textAlign: 'center', color: 'var(--muted)', fontSize: 12.5, marginTop: 12 } }, 'Escribe tu respuesta acá — exactamente como en la tarjeta (no importan tildes ni mayúsculas).') : chat.map((m) => h('div', { key: m.id, style: { display: 'flex', gap: 6, alignItems: 'flex-start' } },
            h(AvatarBubble, { profile: m, size: 20 }),
            h('div', null,
              h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, fontSize: 11.5, color: m.color || '#0a0e2e' } }, m.name, ' '),
              h('span', { style: { fontSize: 13, color: '#0a0e2e' } }, m.text),
            ),
          )),
        ),
        h('div', { style: { display: 'flex', gap: 6, padding: 8, borderTop: '1px solid rgba(10,14,46,.08)', flexShrink: 0 } },
          h('input', {
            value: chatText, onChange: (e) => setChatText(e.target.value),
            onKeyDown: (e) => { if (e.key === 'Enter') enviarGuess(); },
            placeholder: phase !== 'draw' ? 'Esperando la próxima ronda…' : isDrawer ? 'Quien dibuja no puede adivinar' : !myTeamId ? 'No estás en un equipo' : !canSendChat ? 'Le toca adivinar sólo al otro equipo' : 'Escribe tu respuesta…',
            disabled: !canSendChat,
            style: { flex: 1, border: '1px solid rgba(10,14,46,.15)', borderRadius: 20, padding: '8px 14px', fontSize: 13.5, fontFamily: 'inherit' }
          }),
          h('button', { onClick: enviarGuess, disabled: !canSendChat, style: { border: 'none', background: !canSendChat ? 'rgba(21,128,61,.3)' : '#15803d', color: '#fff', borderRadius: 20, padding: '8px 16px', fontWeight: 800, fontSize: 13, cursor: !canSendChat ? 'not-allowed' : 'pointer' } }, 'Enviar'),
        ),
      ),
    ),
  );
}

/* Franja simple de jugadores para el modo libre — "para que sepamos cuántos
   están jugando", con su puntaje al lado. */
function PictabLibreRoster({ juegosUsers, scores, currentDrawerId, myId }) {
  if (!juegosUsers.length) return null;
  return h('div', { style: { width: '100%', display: 'flex', flexWrap: 'wrap', gap: 6, padding: '0 16px 8px', flexShrink: 0 } },
    juegosUsers.map((u) => h('span', {
      key: u.uid,
      style: {
        display: 'flex', alignItems: 'center', gap: 5, background: u.uid === currentDrawerId ? 'rgba(255,208,0,.22)' : (u.uid === myId ? 'rgba(21,128,61,.12)' : 'rgba(10,14,46,.05)'),
        border: u.uid === currentDrawerId ? '1px solid #ffd000' : '1px solid rgba(10,14,46,.1)',
        borderRadius: 20, padding: '3px 10px 3px 4px', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 12, color: '#0a0e2e'
      }
    }, h(AvatarBubble, { profile: u, size: 20 }), u.uid === currentDrawerId ? '✏️ ' : '', u.name, (scores[u.uid] ? h('span', { style: { color: '#a16207', fontWeight: 900, marginLeft: 2 } }, ' · ', scores[u.uid]) : null)))
  );
}

/* ── PictabLibreGame — modo "dibujo libre": pizarra individual, elige quién
   dibuja (al azar o el admin), categoría + dificultad por dado, y todos
   adivinan por el chat (o en voz alta, con el botón manual del admin). ── */
function PictabLibreGame({ session, users, myId, isAdmin, SID, onClose }) {
  const game = session?.pictonary || {};
  const gState = game.gameState;
  const juegosUsers = Object.entries(users || {}).filter(([uid, u]) => effectiveZone(u) === 'juegos' || (isAdmin && uid === myId)).map(([uid, u]) => ({ uid, ...u }));
  const currentDrawerId = game.currentDrawer;
  const currentDrawer = currentDrawerId ? users[currentDrawerId] : null;
  const isDrawer = currentDrawerId === myId;
  const currentItem = game.currentItem;
  const scores = game.scores || {};
  const { remaining, over } = useTimer(gState === 'playing' ? game.roundStartTime : null, PICTONARY_ROUND_SECONDS);
  const [color, setColor] = useState(PICTONARY_COLORS[0]);
  const [tool, setTool] = useState('pen');
  const [chatText, setChatText] = useState('');
  const [chatExpanded, setChatExpanded] = useState(false);
  const chatListRef = useRef(null);
  const lastCheckedRef = useRef(null);
  const timeoutFiredRef = useRef(null);
  const isMobile = useIsMobile();
  const ref = () => db.ref(`sessions/${SID}/pictonary`);

  const chat = game.chat ? Object.entries(game.chat).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.ts || 0) - (b.ts || 0)) : [];
  // Sólo hace auto-scroll DENTRO de la cajita del chat (nunca de toda la
  // pantalla) y sólo si ya estabas mirando el final — así a quien está
  // dibujando no se le arrastra la vista cada vez que alguien escribe.
  useEffect(() => {
    const el = chatListRef.current;
    if (!el) return;
    const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    if (!nearBottom) return;
    const t = setTimeout(() => { if (chatListRef.current) chatListRef.current.scrollTop = chatListRef.current.scrollHeight; }, 60);
    return () => clearTimeout(t);
  }, [chat.length]);
  useEffect(() => { if (!isDrawer) setTool('pen'); }, [isDrawer, currentDrawerId]);

  const nuevaRonda = (uid) => ref().update({
    active: true, gameState: 'rolling', currentDrawer: uid, currentItem: null,
    categoryRoll: null, difficultyRoll: null, roundStartTime: null,
    strokes: null, live: null, chat: null, libreSolvedBy: null
  });
  const seleccionarRandom = async () => {
    if (juegosUsers.length === 0) return;
    const random = juegosUsers[Math.floor(Math.random() * juegosUsers.length)];
    await nuevaRonda(random.uid);
  };
  const seleccionarManual = async (uid) => { await nuevaRonda(uid); };
  const limpiarPizarra = () => ref().update({ strokes: null, live: null });
  const rollCategoryDie = () => {
    const idx = Math.floor(Math.random() * CATEGORY_DIE_FACES.length);
    ref().child('categoryRoll').set({ index: idx, value: CATEGORY_DIE_FACES[idx] });
  };
  const rollDifficultyDie = () => {
    const idx = Math.floor(Math.random() * DIFFICULTY_DIE_FACES.length);
    ref().child('difficultyRoll').set({ index: idx, value: DIFFICULTY_DIE_FACES[idx] });
  };
  const empezarDibujo = async () => {
    const categoria = game.categoryRoll?.value;
    const dificultad = game.difficultyRoll?.value;
    if (!categoria || !dificultad) return;
    const item = pictabPickItem(categoria, dificultad, game.history);
    const history = [...(game.history || []), item.titulo].slice(-8);
    await ref().update({ gameState: 'playing', currentItem: item, roundStartTime: Date.now(), history });
  };
  const cancelarRolling = async () => {
    await ref().update({ gameState: 'idle', currentDrawer: null, currentItem: null, categoryRoll: null, difficultyRoll: null, roundStartTime: null });
  };
  const adivinador = async (uid, uname, near) => {
    const newScores = { ...scores };
    newScores[uid] = (newScores[uid] || 0) + 10;
    if (currentDrawerId) newScores[currentDrawerId] = (newScores[currentDrawerId] || 0) + 5;
    const verbo = near ? 'se acercó lo suficiente a' : 'adivinó';
    await ref().update({
      scores: newScores, gameState: 'idle', currentDrawer: null, currentItem: null,
      categoryRoll: null, difficultyRoll: null, roundStartTime: null, strokes: null, live: null, chat: null,
      libreSolvedBy: null,
      correctGuess: { text: `🎉 ¡${uname || (users[uid] && users[uid].name) || 'Alguien'} ${verbo} "${currentItem?.titulo}"!`, ts: Date.now(), ms: 4000 }
    });
  };
  const skipTurn = async () => {
    await ref().update({ gameState: 'idle', currentDrawer: null, currentItem: null, categoryRoll: null, difficultyRoll: null, roundStartTime: null, strokes: null, live: null, chat: null });
  };
  const finalizar = async () => { await saveGameHistory(SID, scores, users); await ref().update({ gameState: 'finished' }); };
  const cerrar = async () => {
    await db.ref(`sessions/${SID}/pictonary`).remove();
    await db.ref(`sessions/${SID}`).update({ phase: 'waiting' });
    if (onClose) onClose();
  };
  const enviarGuess = () => {
    const t = chatText.trim();
    if (!t || !SID || isDrawer) return;
    const me = users[myId] || {};
    db.ref(`sessions/${SID}/pictonary/chat`).push({
      uid: myId, name: me.name || 'Anon', avatar: me.avatar || '👤', color: me.color || '#ffd000', text: t, ts: Date.now()
    }).catch(() => {});
    setChatText('');
  };

  /* Detección automática: cualquiera que no sea quien dibuja, si escribe la
     palabra exacta (sin tildes/mayúsculas) gana los puntos automáticamente. */
  const resolverAdivinanzaLibre = async (guesserUid, guesserName, near) => {
    const myToken = `${guesserUid}|${Date.now()}|${Math.random()}`;
    const lockRes = await ref().child('libreSolvedBy').transaction((cur) => cur || myToken);
    if (!lockRes.committed || lockRes.snapshot.val() !== myToken) return;
    await adivinador(guesserUid, guesserName, near);
  };
  useEffect(() => {
    if (gState !== 'playing' || !currentItem) return;
    const last = chat[chat.length - 1];
    if (!last || last.id === lastCheckedRef.current) return;
    lastCheckedRef.current = last.id;
    if (last.uid === currentDrawerId) return;
    if (pictabNormalize(last.text) === pictabNormalize(currentItem.titulo)) {
      resolverAdivinanzaLibre(last.uid, last.name);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [chat.length, gState, currentItem?.titulo]);

  /* Si se acaba el tiempo sin que adivinen exacto, revisa si alguien se
     acercó lo suficiente (60%+ de las palabras clave en UN solo mensaje)
     antes de dejar la ronda sin ganador. */
  useEffect(() => {
    if (gState !== 'playing' || !over || !game.roundStartTime || !currentItem) return;
    if (timeoutFiredRef.current === game.roundStartTime) return;
    timeoutFiredRef.current = game.roundStartTime;
    const allowedChat = chat.filter((m) => m.uid !== currentDrawerId);
    let best = null;
    allowedChat.forEach((m) => {
      const ratio = pictabWordMatchRatio(currentItem.titulo, m.text);
      if (ratio >= PICTAB_CLOSE_ENOUGH_RATIO && (!best || ratio > best.ratio)) best = { ratio, m };
    });
    if (best) resolverAdivinanzaLibre(best.m.uid, best.m.name, true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [gState, over, game.roundStartTime]);

  const myZone = effectiveZone(users[myId]);
  if (myZone !== 'juegos' && !isAdmin) return null;

  const wrapStyle = { position: 'fixed', inset: 0, zIndex: 250, background: '#f8f5ef', display: 'flex', flexDirection: 'column', overflow: 'hidden' };
  const headerBar = h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, padding: '12px 16px', borderBottom: '1px solid rgba(10,14,46,.08)', flexShrink: 0 } },
    h('span', { style: { fontSize: 22 } }, '🎨'),
    h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 18, color: '#15803d', textTransform: 'uppercase', letterSpacing: '.05em', flex: 1 } }, 'Pictonary Bíblico · Dibujo libre'),
    isAdmin ? h('button', { onClick: cerrar, title: 'Cerrar juego', style: { border: 'none', background: 'rgba(239,68,68,.12)', color: '#dc2626', borderRadius: 20, padding: '6px 14px', fontWeight: 800, fontSize: 12, fontFamily: 'Barlow Condensed,sans-serif', letterSpacing: '.04em', textTransform: 'uppercase', cursor: 'pointer' } }, '✕ Cerrar') : null,
  );
  const roster = h(PictabLibreRoster, { juegosUsers, scores, currentDrawerId, myId });
  const toasts = h(GameToast, { toast: game.correctGuess, ms: 4000, tone: 'success' });

  /* ── Resultados finales ── */
  if (gState === 'finished') {
    const ranking = Object.entries(scores).map(([uid, pts]) => ({ uid, pts, user: users[uid] || { name: '?', avatar: '👤', color: '#8b5cf6' } })).sort((a, b) => b.pts - a.pts);
    return h('div', { style: wrapStyle },
      headerBar,
      h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24, gap: 14, overflowY: 'auto' } },
        h(Confetti, null),
        h('div', { style: { fontSize: 54 } }, '🏆'),
        h('h2', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 30, color: '#15803d', textTransform: 'uppercase', letterSpacing: '.06em', margin: 0, textAlign: 'center' } }, '¡Pictonary Bíblico — Resultados!'),
        h('div', { style: { width: '100%', maxWidth: 420, display: 'flex', flexDirection: 'column', gap: 8, marginTop: 8 } },
          ranking.map((r, i) => h('div', { key: r.uid, style: { display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', borderRadius: 14, background: i === 0 ? 'linear-gradient(135deg,rgba(255,208,0,.22),rgba(255,208,0,.06))' : 'rgba(10,14,46,.04)', border: i === 0 ? '2px solid #ffd000' : '1px solid rgba(10,14,46,.1)' } },
            h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 24, color: i === 0 ? '#a16207' : '#0a0e2e', width: 36, textAlign: 'center' } }, i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`),
            h(AvatarBubble, { profile: r.user, size: 40 }),
            h('div', { style: { flex: 1, fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 18, color: '#0a0e2e' } }, r.user.name),
            h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 22, color: '#a16207' } }, r.pts, ' pts'),
          )),
        ),
        isAdmin ? h('button', { onClick: cerrar, style: { marginTop: 14, background: '#ffd000', border: 'none', borderRadius: 14, padding: '14px 32px', color: '#f8f5ef', fontWeight: 900, fontSize: 14, fontFamily: 'Barlow Condensed,sans-serif', letterSpacing: '.05em', textTransform: 'uppercase', cursor: 'pointer' } }, 'Cerrar juego') : null,
      ),
    );
  }

  /* ── Idle: elegir/pasar turno ── */
  if (!gState || gState === 'idle') {
    const ranking = Object.entries(scores).map(([uid, pts]) => ({ uid, pts, user: users[uid] || { name: '?', avatar: '👤', color: '#8b5cf6' } })).sort((a, b) => b.pts - a.pts);
    return h('div', { style: wrapStyle },
      headerBar, roster, toasts,
      h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24, gap: 14, overflowY: 'auto' } },
        h('p', { style: { textAlign: 'center', color: 'var(--muted)', fontSize: 13, maxWidth: 340 } }, 'Se elige a alguien al azar para dibujar un personaje, lugar o escena bíblica. El resto adivina por el chat (se detecta solo) o en voz alta.'),
        ranking.length > 0 ? h('div', { style: { width: '100%', maxWidth: 380, display: 'flex', flexDirection: 'column', gap: 6 } },
          ranking.map((r) => h('div', { key: r.uid, style: { display: 'flex', alignItems: 'center', gap: 10, padding: '8px 12px', borderRadius: 12, background: 'rgba(10,14,46,.04)' } },
            h(AvatarBubble, { profile: r.user, size: 28 }),
            h('span', { style: { flex: 1, fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 14, color: '#0a0e2e' } }, r.user.name),
            h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 14, color: '#a16207' } }, r.pts),
          )),
        ) : null,
        isAdmin ? h('div', { style: { width: '100%', maxWidth: 380, display: 'flex', flexDirection: 'column', gap: 10 } },
          h('button', { onClick: seleccionarRandom, disabled: juegosUsers.length === 0, style: { padding: '14px 20px', background: juegosUsers.length === 0 ? 'rgba(21,128,61,.2)' : '#15803d', border: 'none', borderRadius: 14, color: '#f8f5ef', fontWeight: 900, fontSize: 14, fontFamily: 'Barlow Condensed,sans-serif', letterSpacing: '.05em', textTransform: 'uppercase', cursor: juegosUsers.length === 0 ? 'not-allowed' : 'pointer', opacity: juegosUsers.length === 0 ? .5 : 1 } }, '🎲 Elegir dibujante al azar'),
          h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 11, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.15em', marginTop: 4 } }, 'O elige tú quién dibuja:'),
          juegosUsers.length === 0 ? h('div', { style: { textAlign: 'center', color: 'var(--muted)', fontSize: 13, padding: 14 } }, 'Nadie en la zona de juegos aún.') : h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 } },
            juegosUsers.map((u) => h('button', { key: u.uid, onClick: () => seleccionarManual(u.uid), style: { display: 'flex', alignItems: 'center', gap: 8, background: 'rgba(10,14,46,.05)', border: '1px solid rgba(10,14,46,.12)', borderRadius: 10, padding: '8px 10px', cursor: 'pointer', color: '#0a0e2e', fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 14, textAlign: 'left' } },
              h(AvatarBubble, { profile: u, size: 26 }),
              h('span', { style: { flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, u.name),
            )),
          ),
          ranking.length > 0 ? h('button', { onClick: finalizar, style: { marginTop: 6, background: 'rgba(255,208,0,.18)', border: '1px solid rgba(255,208,0,.4)', borderRadius: 14, padding: '12px', color: '#a16207', fontWeight: 800, fontSize: 13, fontFamily: 'Barlow Condensed,sans-serif', letterSpacing: '.04em', textTransform: 'uppercase', cursor: 'pointer' } }, '🏆 Finalizar y ver resultados') : null,
        ) : h('div', { style: { textAlign: 'center', color: 'var(--muted)', fontSize: 14, maxWidth: 300 } }, 'Esperando que el admin elija quién dibuja… ', h(Spinner, { size: 22 })),
      ),
    );
  }

  /* ── Rolling: el dibujante tira los dados de categoría y dificultad ── */
  if (gState === 'rolling') {
    const catIdx = game.categoryRoll?.index;
    const difIdx = game.difficultyRoll?.index;
    const bothRolled = catIdx != null && difIdx != null;
    const dieBlock = (label, faces, idx, roll, rollLabel) => h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 } },
      h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, fontSize: 11, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.14em' } }, label),
      h(DiceCube3D, { faces, resultIndex: idx }),
      idx != null
        ? h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 15, color: '#15803d', textTransform: 'uppercase' } }, faces[idx])
        : (isDrawer ? h('button', { onClick: roll, style: { padding: '8px 18px', background: '#15803d', border: 'none', borderRadius: 20, color: '#fff', fontWeight: 800, fontSize: 12, fontFamily: 'Barlow Condensed,sans-serif', letterSpacing: '.04em', textTransform: 'uppercase', cursor: 'pointer' } }, rollLabel) : h('div', { style: { fontSize: 11, color: 'var(--muted)' } }, '(sin tirar)')),
    );
    return h('div', { style: wrapStyle },
      headerBar, roster,
      h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24, gap: 20, overflowY: 'auto' } },
        currentDrawer ? h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, background: 'rgba(10,14,46,.05)', padding: '8px 16px', borderRadius: 20 } },
          h(AvatarBubble, { profile: currentDrawer, size: 32 }),
          h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, fontSize: 15, color: '#0a0e2e' } }, isDrawer ? '¡Te toca tirar los dados!' : `${currentDrawer.name} está tirando los dados…`),
        ) : null,
        h('div', { style: { display: 'flex', gap: 30, flexWrap: 'wrap', justifyContent: 'center' } },
          dieBlock('Categoría', CATEGORY_DIE_FACES, catIdx, rollCategoryDie, '🎲 Tirar'),
          dieBlock('Dificultad', DIFFICULTY_DIE_FACES, difIdx, rollDifficultyDie, '🎲 Tirar'),
        ),
        isDrawer && bothRolled ? h('button', { onClick: empezarDibujo, style: { padding: '14px 28px', background: '#ffd000', border: 'none', borderRadius: 20, color: '#0a0e2e', fontWeight: 900, fontSize: 15, fontFamily: 'Barlow Condensed,sans-serif', letterSpacing: '.05em', textTransform: 'uppercase', cursor: 'pointer', boxShadow: '0 8px 24px rgba(255,208,0,.4)' } }, '🎨 ¡A dibujar! (1:30)') : null,
        !isDrawer ? h('div', { style: { textAlign: 'center', color: 'var(--muted)', fontSize: 13, fontStyle: 'italic' } }, 'Esperando a que termine de tirar los dados…') : null,
        isAdmin ? h('button', { onClick: cancelarRolling, style: { border: 'none', background: 'none', color: 'var(--muted)', fontSize: 12, textDecoration: 'underline', cursor: 'pointer' } }, 'Cancelar y elegir a otra persona') : null,
      ),
    );
  }

  /* ── Jugando: pizarra + herramientas + chat lateral ── */
  const timeColor = over ? '#dc2626' : remaining < 20 ? '#c2410c' : '#a16207';
  const guessers = juegosUsers.filter((u) => u.uid !== currentDrawerId);
  const dificultadColor = { 'Fácil': '#15803d', 'Mediano': '#c2410c', 'Difícil': '#dc2626' }[currentItem?.dificultad] || '#a16207';
  return h('div', { style: wrapStyle },
    headerBar, roster, toasts,
    h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, padding: '8px 16px', flexWrap: 'wrap', flexShrink: 0 } },
      h('div', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 900, fontSize: 30, color: timeColor, lineHeight: 1, minWidth: 64 } }, formatTime(Math.max(0, remaining))),
      currentDrawer ? h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, background: 'rgba(10,14,46,.05)', padding: '6px 12px', borderRadius: 20 } },
        h(AvatarBubble, { profile: currentDrawer, size: 28 }),
        h('span', { style: { fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 800, fontSize: 13, color: '#0a0e2e' } }, isDrawer ? 'Tú dibujas' : `${currentDrawer.name} dibuja`),
      ) : null,
      currentItem?.categoria ? h('div', { style: { display: 'flex', alignItems: 'center', gap: 6, background: 'rgba(21,128,61,.1)', border: '1px solid rgba(21,128,61,.3)', padding: '6px 14px', borderRadius: 20 } },
        h('span', { style: { fontSize: 10, fontFamily: 'Barlow Condensed,sans-serif', fontWeight: 700, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '.1em' } }, 'Categoría'),
