// Avatar customizer — body / arms / legs colors, accessories and a profile photo.

class Component extends React.Component {
  COLS = 16; ROWS = 12; TW = 62; TH = 31; OX = 438; OY = 102; LW = 1000; LH = 560; WALLH = 94;
  iso = (x, y) => ({ left: this.OX + (x - y) * this.TW / 2, top: this.OY + (x + y) * this.TH / 2 });
  depth = (x, y) => 1000 + Math.round((x + y) * 12);
  s2t = (px, py) => { const a = 2 * (px - this.OX) / this.TW, b = 2 * (py - this.OY) / this.TH; return { x: (a + b) / 2, y: (b - a) / 2 }; };
  clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  ROOMS = ROOMS; FURN = FURN; MOODS = MOODS; REACT_EMOJIS = REACT_EMOJIS; ACTS = ACTS;

  state = {
    view: 'lobby', currentRoom: null,
    roomNames: { mision: 'Misión Joven', confra: 'Confraternización', repaso: 'Repaso · Hechos 4', templo: 'Templo · Adoración' },

    chars: [
      { id: 'me', name: 'Tú', emoji: '🌟', color: '#ffd000', bodyColor: '#ffd000', armColor: '#ffd000', legColor: '#2a2f52', accessory: 'none', photo: null, x: 8, y: 6.5, status: '', mood: '', room: null }
    ],

      confra: [{ id: 'c1', type: 'sofa', x: 5, y: 4, dir: 0 }, { id: 'c2', type: 'sofa', x: 9, y: 4, dir: 2 }, { id: 'c3', type: 'table', x: 7, y: 6, dir: 0 }, { id: 'c4', type: 'lamp', x: 13, y: 2, dir: 0 }, { id: 'c5', type: 'rug', x: 7, y: 8, dir: 0 }, { id: 'c6', type: 'plant', x: 1, y: 10, dir: 0 }],
      repaso: [{ id: 'r1', type: 'screen', x: 8, y: 1, dir: 0 }, { id: 'r2', type: 'chair', x: 6, y: 5, dir: 0 }, { id: 'r3', type: 'chair', x: 8, y: 5, dir: 0 }, { id: 'r4', type: 'chair', x: 10, y: 5, dir: 0 }, { id: 'r5', type: 'table', x: 8, y: 8, dir: 0 }, { id: 'r6', type: 'plant', x: 14, y: 1, dir: 0 }],
      templo: [{ id: 't1', type: 'pulpit', x: 8, y: 2, dir: 0 }, { id: 't2', type: 'chair', x: 6, y: 6, dir: 3 }, { id: 't3', type: 'chair', x: 10, y: 6, dir: 1 }, { id: 't4', type: 'rug', x: 8, y: 5, dir: 0 }, { id: 't5', type: 'plant', x: 1, y: 10, dir: 0 }, { id: 't6', type: 'plant', x: 14, y: 10, dir: 0 }],
    },
    selectedId: null, editing: false, placeMode: null, selFurn: null, dragging: false,
    activity: null, reacts: [], scale: 1, lobbyDragging: false,
    lobby: {
      me: { lx: 0.5, depth: 0.62 },
      others: [],
      prompt: null, dismissed: null, lastSeg: 0
    },
  };

  componentDidMount() {
    this._onResize = () => this._measure();
    window.addEventListener('resize', this._onResize);
    this._initFirebase();
  }

  // Inicializa la suscripción a Firebase y registra al usuario actual en la sesión.
  _initFirebase() {
    const user = this.props.user;
    if (!user || !window.db) return;
    this.uid = user.uid;
    this.SID = getSID();
    this.isAdmin = isAdminEmail(user.email);
    const meRef = window.db.ref(`users/${this.SID}/${this.uid}`);
    const profileRef = window.db.ref(`profiles/${this.uid}`);
    // Lee el perfil persistente (nombre, color, accesorios) y entra en la sesión.
    profileRef.get().then((snap) => {
      const p = snap.val() || {};
      const myMe = this.state.chars.find((c) => c.id === 'me') || {};
      const merged = {
        id: this.uid,
        name: p.name || user.email?.split('@')[0] || 'Anon',
        emoji: p.emoji || myMe.emoji || '🌟',
        color: p.color || myMe.color || '#ffd000',
        bodyColor: p.bodyColor || p.color || myMe.bodyColor || '#ffd000',
        armColor: p.armColor || p.color || myMe.armColor || '#ffd000',
        legColor: p.legColor || myMe.legColor || '#2a2f52',
        accessory: p.accessory || 'none',
        photo: p.photo || null,
        x: myMe.x ?? 8, y: myMe.y ?? 6.5,
        status: p.status || '', mood: p.mood || '',
        room: null
      };
      // Actualiza al "me" local con datos del perfil.
      this.setState((s) => ({
        chars: s.chars.map((c) => c.id === 'me' ? { ...c, ...merged, id: 'me' } : c)
      }));
      // Registra al usuario en la sesión y limpia al desconectar.
      meRef.set({ ...merged, joinedAt: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
      meRef.onDisconnect().remove();
    });
    // Listener: usuarios en la sesión → state.chars (mantiene a 'me' como id local).
    this._usersRef = window.db.ref(`users/${this.SID}`);
    this._usersRef.on('value', (snap) => {
      const data = snap.val() || {};
      const others = Object.entries(data)
        .filter(([uid]) => uid !== this.uid)
        .map(([uid, u]) => ({
          id: uid, name: u.name || 'Anon', emoji: u.emoji || '👤',
          color: u.color || '#ffd000',
          bodyColor: u.bodyColor || u.color || '#ffd000',
          armColor: u.armColor || u.color || '#ffd000',
          legColor: u.legColor || '#2a2f52',
          accessory: u.accessory || 'none',
          photo: u.photo || null,
          x: u.x ?? 8, y: u.y ?? 6.5,
          status: u.status || '', mood: u.mood || '',
          room: u.room || null
        }));
      this.setState((s) => {
        const me = s.chars.find((c) => c.id === 'me');
        return { chars: me ? [me, ...others] : others };
      });
    });
    // Listener: estado de salas abiertas y nombres.
    this._openRoomsRef = window.db.ref(`sessions/${this.SID}/openRooms`);
    this._openRoomsRef.on('value', (snap) => {
      const v = snap.val() || {};
      this.setState({ started: { mision: !!v.mision, confra: !!v.confra, repaso: !!v.repaso, templo: !!v.templo } });
    });
    this._roomNamesRef = window.db.ref(`sessions/${this.SID}/roomNames`);
    this._roomNamesRef.on('value', (snap) => {
      const v = snap.val();
      if (v) this.setState((s) => ({ roomNames: { ...s.roomNames, ...v } }));
    });
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._lraf) cancelAnimationFrame(this._lraf);
    if (this._usersRef)     this._usersRef.off();
    if (this._openRoomsRef) this._openRoomsRef.off();
    if (this._roomNamesRef) this._roomNamesRef.off();
    if (this.uid && this.SID && window.db) {
      window.db.ref(`users/${this.SID}/${this.uid}`).remove().catch(() => {});
    }
  }

  // Persiste cualquier campo del usuario actual en Firebase (con throttle suave).
  _saveMe = (patch) => {
    if (!this.uid || !this.SID || !window.db) return;
    window.db.ref(`users/${this.SID}/${this.uid}`).update(patch).catch(() => {});
  };
  _saveProfile = (patch) => {
    if (!this.uid || !window.db) return;
    window.db.ref(`profiles/${this.uid}`).update(patch).catch(() => {});
  };
  _measure = () => {
    const el = this.stageEl; if (!el) return;
    const sw = el.clientWidth, sh = el.clientHeight;
    const scale = this.clamp(Math.min((sw - 12) / this.LW, (sh - 12) / this.LH), 0.32, 1.2);
    if (Math.abs(scale - this.state.scale) > 0.001) this.setState({ scale });
  };
  setStage = (el) => { this.stageEl = el; if (el) requestAnimationFrame(this._measure); };

  /* ---- navigation ---- */
  enterRoom = (key) => {
    this._saveMe({ room: key, x: 8, y: 7 });
    this.setState((s) => ({ view: 'room', currentRoom: key, selectedId: null, selFurn: null, placeMode: null, activity: null, chars: s.chars.map((c) => c.id === 'me' ? { ...c, room: key, x: 8, y: 7 } : c) }));
  };
  exitRoom = () => {
    this._saveMe({ room: null });
    this.setState((s) => ({ view: 'lobby', currentRoom: null, selectedId: null, selFurn: null, placeMode: null, activity: null, chars: s.chars.map((c) => c.id === 'me' ? { ...c, room: null } : c) }));
  };
  // Admin abre/cierra cualquier sala remotamente; varias pueden estar en vivo a la vez.
  toggleStart = (key) => {
    if (!this.isAdmin) return;
    const cur = !!this.state.started[key];
    if (window.db && this.SID) {
      window.db.ref(`sessions/${this.SID}/openRooms/${key}`).set(!cur).catch(() => {});
    }
    // Si estoy en el lobby parado frente a la puerta, autoentro tras un instante.
    const seg = Math.max(0, Math.min(3, Math.floor(this.state.lobby.me.lx * 4)));
    const here = this.ROOMS[seg].key;
    if (!cur && this.state.view === 'lobby' && here === key) setTimeout(() => this.enterRoom(key), 400);

    return h('div', { key: r.key, style: r.cardStyle },
      h('div', { style: r.bandStyle },
        h('span', { style: r.letterStyle }, r.letter),
        h('div', { style: { display: 'flex', gap: 6, position: 'relative', zIndex: 2 } },
          r.members.map((m, i) => h('span', { key: i, style: m.style }, m.photo ? h('img', { src: m.photo, alt: '', style: { width: '100%', height: '100%', objectFit: 'cover' } }) : m.emoji)),
        ),
      ),
      h('div', { style: { padding: '11px 14px 13px', display: 'flex', flexDirection: 'column', gap: 5 } },
        h('div', { style: r.mrntStyle }, r.mrnt),
        h('div', { style: r.nameStyle }, r.name),
        h('div', { style: r.statusStyle }, r.statusText),
        h('button', { onClick: r.onEnter, style: r.enterStyle }, 'Entrar →'),
        this.isAdmin ? h('div', { style: { display: 'flex', gap: 8 } },
          h('button', { onClick: r.onToggleStart, style: r.startStyle }, r.startLabel),
          h('button', { onClick: r.onRename, style: r.renameStyle }, '✎'),
        ) : null,
      ),
    );
  }
  renderLobbySection(v) {
    return h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: 'radial-gradient(ellipse at 50% 0%, #fffdf8, var(--cream-50) 70%)' } },
      h('div', { style: { display: 'flex', gap: 14, padding: '14px 20px 6px', flexShrink: 0 } }, v.roomCards.map((r) => this.renderRoomCard(r))),
      v.lobbyGround,
    );
  }
  renderFooter(v) {
    return h('footer', { style: { display: 'flex', alignItems: 'center', gap: 7, padding: '10px 16px', background: '#fff', borderTop: '1px solid var(--border-on-light)', flexShrink: 0, flexWrap: 'wrap', zIndex: 50 } },
      h('span', { style: { fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 10, letterSpacing: '.16em', textTransform: 'uppercase', color: 'var(--ink-soft)', marginRight: 2 } }, 'Colocar'),
      v.furnitureItems.map((f, i) => h('button', { key: i, onClick: f.onClick, style: f.style }, h('span', { style: { fontSize: 15 } }, f.icon), f.label)),
      h('div', { style: { flex: 1, minWidth: 8 } }),
      h('button', { onClick: () => this.setState({ avatarEditing: true }), style: { display: 'flex', alignItems: 'center', gap: 6, background: '#fff', color: 'var(--ink)', border: '1px solid var(--border-on-light)', borderRadius: 'var(--r-pill)', padding: '9px 16px', cursor: 'pointer', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 13, letterSpacing: '.05em', textTransform: 'uppercase' } }, '🎨 Mi avatar'),
      h('button', { onClick: v.onMyStatus, style: { display: 'flex', alignItems: 'center', gap: 7, background: 'var(--action-accent)', color: 'var(--navy-900)', border: 'none', borderRadius: 'var(--r-pill)', padding: '9px 18px', cursor: 'pointer', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 13, letterSpacing: '.05em', textTransform: 'uppercase', boxShadow: 'var(--glow-yellow)' } }, '✎ Mi estado'),
    );
  }
  render() {
    const v = this.renderVals();
    const st = this.state;
    const me = st.chars.find((c) => c.id === 'me') || {};
    return h('div', { style: { display: 'flex', flexDirection: 'column', height: '100vh', width: '100%', background: 'var(--cream-50)', fontFamily: 'var(--font-sans)', overflow: 'hidden', WebkitUserSelect: 'none', userSelect: 'none' } },
      this.renderHeader(v, me),
      v.inLobby ? this.renderLobbySection(v) : null,
      v.inRoom ? h(React.Fragment, null, v.stage, this.renderFooter(v)) : null,
      st.avatarEditing ? h(AvatarEditor, { char: me, onSave: this.saveAvatar, onClose: () => this.setState({ avatarEditing: false }) }) : null,
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(AppRoot));
</script>
</body>
</html>
